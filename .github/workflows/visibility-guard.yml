# Micro Seed 노출 게이트 CI
#
# 정본: docs/constitution/MICRO_SEED_LANE_CONSTITUTION.md §3 C-2 · §4 · §7
#
# 이 워크플로우가 존재하는 이유:
#   M0 에서 3축 판정(src/lib/post-visibility.ts)을 단일 지점으로 세웠지만,
#   가드(scripts/check-post-visibility.mjs)가 로컬 실행뿐이면 사람이 잊는 순간 무력해진다.
#   여러 세션(매거진 트랙 · Micro Seed 트랙)이 병렬로 main 에 들어오는 구조라
#   "각자 로컬에서 돌렸겠지" 를 전제할 수 없다.
#
# main push 에서도 도는 이유:
#   PR 두 개가 각각 통과해도 합쳐지면 깨지는 semantic conflict 가 있다.
#   예: A 가 홈 쿼리를 바꾸고 B 가 게이트 함수명을 바꾸면 각 PR 은 녹색이지만 main 은 빨갛다.
#   merge 후 한 번 더 돌려야 그걸 잡는다.
name: visibility-guard

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR 에 연속 push 하면 이전 run 을 취소한다 — 러너 시간 낭비를 막는다.
concurrency:
  group: visibility-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Micro Seed 3축 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # repo 에 engines·.nvmrc 가 없다. Next 14.2 지원 범위의 LTS 로 고정한다.
          # 버전을 올릴 땐 Vercel 프로젝트 설정과 함께 움직여야 한다.
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 게이트 가드가 먼저다. 순수 파일 파싱이라 Prisma 없이 몇 초면 끝나고,
      # 이게 이 워크플로우의 본래 목적이므로 실패를 가장 빨리 보여준다.
      - name: Micro Seed 노출 게이트
        run: npm run check:visibility

      # typecheck 는 @prisma/client 타입을 필요로 한다.
      # generate 는 스키마만 읽으므로 DB 접속이 없다 — CI 에 DATABASE_URL 을 두지 않는다.
      - name: Prisma Client 생성
        run: npx prisma generate

      # 가드는 정규식 기반이라 "심볼이 사라진 것" 은 잡아도
      # "남은 호출부가 옛 이름을 쓰는 것" 은 못 잡는다.
      # M0 의 getRecentPosts → getRecentDiscoveryPosts 개명이 정확히 그 사례다.
      # 둘을 같이 돌려야 회귀 차단이 실제로 닫힌다.
      - name: 타입 검사
        run: npm run typecheck

      # ── Micro Seed Founder Gate fixture ────────────────────────
      #
      # 여기까지의 단계는 "노출 게이트가 살아 있는가" 만 본다.
      # 발행 게이트(R1~R11 · G-A · G-B)가 실제로 막는지는 fixture 가 답한다.
      #
      # 🔴 이걸 CI 에 두지 않으면 회귀 차단이 로컬 실행에만 의존한다.
      #    사람이 잊는 순간 무력해지는 건 check:visibility 와 같은 이유다 —
      #    여러 세션이 병렬로 main 에 들어오는 구조에서 "각자 돌렸겠지" 는 전제할 수 없다.
      #
      # 셋 다 DB · Google Sheet · 네트워크 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      #
      # 순서에 이유가 있다: validate(규칙 자체) → read(Sheet 매핑) → plan(원장 주입 + guard).
      # 아래로 갈수록 위를 딛고 서므로 무너진 층을 가장 먼저 보여준다.
      - name: Micro Seed 검증 규칙 (R1~R11 · G-A · G-B)
        run: npm run micro-seed:validate

      - name: Micro Seed Sheet reader (17열 · 매핑)
        run: npm run micro-seed:read

      # plan 은 tsx 로 돈다 — src/lib/micro-seed-guard.ts 를 직접 부르기 위해서다.
      # .mjs 는 .ts 를 import 할 수 없고, Node 타입 스트리핑은 22.6+ 라 여기(Node 20)선 못 쓴다.
      - name: Micro Seed 발행 계획 (원장 주입 + contentGuard)
        run: npm run micro-seed:plan

      # 위 plan 은 실제 guard 를 주입한 경로다. 주입 배선 자체(fake guard)는 별도로 본다 —
      # guard 없이도 파이프라인이 무너지지 않는지, 미주입이 unchecked 로 드러나는지 확인한다.
      - name: Micro Seed 주입 배선 (guard 미주입 경로)
        run: npm run micro-seed:plan-wiring

      # 수집 레일(82cook collector · 품질 플래그)의 계약.
      #
      # 🔴 이 fixture 가 CI 밖에 있으면 로컬 실행에만 의존한다 — 위 넷을 CI 에 둔 것과 같은 이유다.
      #    특히 "자동 거부가 늘지 않았다" 검사가 여기 있다. 품질 플래그는 **선별 보조**이지
      #    거부 엔진이 아닌데, 그 경계는 코드 한 줄이면 무너진다(플래그로 continue 하면 끝이다).
      #    거부로 조용히 버려진 후보는 아무도 세지 않으므로 사람 눈에 띄지 않는다.
      #    막아야 할 회귀가 눈에 안 보이는 종류라 CI 가 대신 봐야 한다.
      #
      # 네트워크 · DB · Sheet 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed 수집 레일 (82cook · 품질 플래그)
        run: npm run micro-seed:collect-check

      # 승인 레일(approve-live · sync-approval)의 계약.
      #
      # 🔴 approve-live 는 DB 와 Sheet 의 승인 상태를 바꾸는 **운영 명령**이다.
      #    발행 직전 단계를 여는 문이라 여기서 잘못되면 그 다음이 전부 잘못된다.
      #
      #    특히 두 검사가 CI 밖에 있으면 안 된다:
      #      · 단일 candidate 만 승격하는가 — Sheet 전체 승격 경로가 섞여 들어오면
      #        명령은 성공하고 엉뚱한 후보가 발행 대기로 올라간다. 아무도 모른다.
      #      · publisher 를 부르지 않는가 — 승인과 발행 사이에 사람이 서야 한다는
      #        경계가 코드 한 줄로 사라질 수 있다.
      #
      # 네트워크 · DB · Sheet 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed 승인 레일 (approve-live · 단일 후보)
        run: npm run micro-seed:approve-check

      # SRN 승인 화면의 계약.
      #
      # 🔴 이 화면은 사람이 "원문 그대로 내보내겠다" 고 누르는 곳이다.
      #    그래서 막아야 할 회귀가 전부 **조용한** 종류다:
      #      · 다른 축(Seed·Raw·Hold·Drop·Access)이 섞여 들어오는 것 —
      #        화면은 멀쩡히 뜨고, 사람이 누르는 대상만 바뀐다.
      #      · 자격 길이가 title+body 로 슬쩍 바뀌는 것 — §4-Y ④ 는 body 기준이다.
      #        제목은 운영자가 바꿀 수 있어서, 기준에 넣으면 기준이 기준이 아니게 된다.
      #      · 누르지 않은 후보가 기본값으로 승인되어 export 되는 것 —
      #        그러면 "승인" 이 사람의 행위가 아니게 된다.
      #
      # 네트워크 · DB · Sheet 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed SRN 승인 화면 (축 제한 · body 기준 · 사람 승인)
        run: npm run micro-seed:srn-check

      # 우나어 legacy read-only 커넥터의 계약.
      #
      # 🔴 우나어는 우리 **운영 DB** 다. 커넥터가 write SQL 을 만들 수 있으면
      #    role 권한(SELECT only)과 read-only 트랜잭션이 뚫리는 날 막을 것이 없다.
      #    그리고 원문 컬럼이 하나라도 VoiceSource 에 생기면
      #    "참조하되 복제하지 않는다" 는 1차 전략 전체가 무너진다 —
      #    33,031건 본문과 154,872개 댓글이 소란소란 DB 로 넘어온다.
      #
      #    두 회귀 모두 **조용하다**: 코드는 돌고 테스트는 통과하며
      #    문제는 데이터가 쌓인 뒤에야 드러난다. CI 가 대신 봐야 한다.
      #
      # 네트워크 · DB 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Voice 우나어 커넥터 (read-only · 원문 미복제)
        run: npm run voice:unao-readonly-check

      # VoiceSource 적재 경로의 계약.
      #
      # 🔴 두 회귀가 조용하다:
      #    · 원문이 소란소란 DB 로 넘어오는 것 — 33,031건 본문과 154,872개 댓글이
      #      한 줄 추가로 따라온다. 코드는 돌고 테스트는 통과한다.
      #    · usedAt 을 approved 로 쓰는 것 — 6,494건이 "사람이 승인했다" 는
      #      거짓 정답지가 되고, Voice Engine 은 그것을 학습한다.
      #
      #    그리고 배치로 번지면 되돌리기 어렵다. 이번 단계는 --limit=1 뿐이다.
      #
      # 네트워크 · DB 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      # 적재 경로(1건) + 배치 경로(9,674건) 를 함께 본다.
      #
      # 🔴 배치는 1건과 위험의 크기가 다르다. 되돌리기 어렵고,
      #    "--apply 는 --limit 을 요구한다" 가 무너지면 한 번에 9,674건이 들어간다.
      #    중복 SKIP 이 무너지면 재실행이 중복을 쌓는다.
      - name: Voice 적재 경로 (원문 미저장 · 배치 게이트)
        run: npm run voice:unao-import-check

      # 🔴 신규 저장 경로다. 기존 fixture 는 VoiceDerived · VoiceCommentSignal 을 모른다 —
      #    원문 · 댓글 · 닉네임 미저장과 "타겟 설명어 부활" 회귀를 여기서만 잡는다.
      - name: Voice 규칙 신호 (원문 미저장 · 비용 0원 · 타겟 설명어 금지)
        run: npm run voice:derive-check

      # 🔴 VE-M3 부터는 실수가 돈이다. LLM SDK import 한 줄 · fetch 한 줄이 곧 비용이다 —
      #    기존 fixture 는 M3 경로를 모르므로 여기서만 잡힌다.
      # 🔴 VE-M3-3 부터 provider 호출 경로가 생겼다. 허용 파일은 adapter · run 둘뿐이고
      #    유료 게이트 9중 · 저장 전 원문 대조 · API key 로그 유출 0 을 여기서 잡는다.
      - name: Voice M3 (유료 게이트 · 원문 유출 · key 유출 · 층화 표본)
        run: npm run voice:m3-check
