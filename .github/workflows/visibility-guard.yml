# Micro Seed 노출 게이트 CI
#
# 정본: docs/constitution/MICRO_SEED_LANE_CONSTITUTION.md §3 C-2 · §4 · §7
#
# 이 워크플로우가 존재하는 이유:
#   M0 에서 3축 판정(src/lib/post-visibility.ts)을 단일 지점으로 세웠지만,
#   가드(scripts/check-post-visibility.mjs)가 로컬 실행뿐이면 사람이 잊는 순간 무력해진다.
#   여러 세션(매거진 트랙 · Micro Seed 트랙)이 병렬로 main 에 들어오는 구조라
#   "각자 로컬에서 돌렸겠지" 를 전제할 수 없다.
#
# main push 에서도 도는 이유:
#   PR 두 개가 각각 통과해도 합쳐지면 깨지는 semantic conflict 가 있다.
#   예: A 가 홈 쿼리를 바꾸고 B 가 게이트 함수명을 바꾸면 각 PR 은 녹색이지만 main 은 빨갛다.
#   merge 후 한 번 더 돌려야 그걸 잡는다.
name: visibility-guard

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR 에 연속 push 하면 이전 run 을 취소한다 — 러너 시간 낭비를 막는다.
concurrency:
  group: visibility-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Micro Seed 3축 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # repo 에 engines·.nvmrc 가 없다. Next 14.2 지원 범위의 LTS 로 고정한다.
          # 버전을 올릴 땐 Vercel 프로젝트 설정과 함께 움직여야 한다.
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 게이트 가드가 먼저다. 순수 파일 파싱이라 Prisma 없이 몇 초면 끝나고,
      # 이게 이 워크플로우의 본래 목적이므로 실패를 가장 빨리 보여준다.
      - name: Micro Seed 노출 게이트
        run: npm run check:visibility

      # typecheck 는 @prisma/client 타입을 필요로 한다.
      # generate 는 스키마만 읽으므로 DB 접속이 없다 — CI 에 DATABASE_URL 을 두지 않는다.
      - name: Prisma Client 생성
        run: npx prisma generate

      # 가드는 정규식 기반이라 "심볼이 사라진 것" 은 잡아도
      # "남은 호출부가 옛 이름을 쓰는 것" 은 못 잡는다.
      # M0 의 getRecentPosts → getRecentDiscoveryPosts 개명이 정확히 그 사례다.
      # 둘을 같이 돌려야 회귀 차단이 실제로 닫힌다.
      - name: 타입 검사
        run: npm run typecheck

      # ── Micro Seed Founder Gate fixture ────────────────────────
      #
      # 여기까지의 단계는 "노출 게이트가 살아 있는가" 만 본다.
      # 발행 게이트(R1~R11 · G-A · G-B)가 실제로 막는지는 fixture 가 답한다.
      #
      # 🔴 이걸 CI 에 두지 않으면 회귀 차단이 로컬 실행에만 의존한다.
      #    사람이 잊는 순간 무력해지는 건 check:visibility 와 같은 이유다 —
      #    여러 세션이 병렬로 main 에 들어오는 구조에서 "각자 돌렸겠지" 는 전제할 수 없다.
      #
      # 셋 다 DB · Google Sheet · 네트워크 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      #
      # 순서에 이유가 있다: validate(규칙 자체) → read(Sheet 매핑) → plan(원장 주입 + guard).
      # 아래로 갈수록 위를 딛고 서므로 무너진 층을 가장 먼저 보여준다.
      - name: Micro Seed 검증 규칙 (R1~R11 · G-A · G-B)
        run: npm run micro-seed:validate

      - name: Micro Seed Sheet reader (17열 · 매핑)
        run: npm run micro-seed:read

      # plan 은 tsx 로 돈다 — src/lib/micro-seed-guard.ts 를 직접 부르기 위해서다.
      # .mjs 는 .ts 를 import 할 수 없고, Node 타입 스트리핑은 22.6+ 라 여기(Node 20)선 못 쓴다.
      - name: Micro Seed 발행 계획 (원장 주입 + contentGuard)
        run: npm run micro-seed:plan

      # 위 plan 은 실제 guard 를 주입한 경로다. 주입 배선 자체(fake guard)는 별도로 본다 —
      # guard 없이도 파이프라인이 무너지지 않는지, 미주입이 unchecked 로 드러나는지 확인한다.
      - name: Micro Seed 주입 배선 (guard 미주입 경로)
        run: npm run micro-seed:plan-wiring

      # 수집 레일(82cook collector · 품질 플래그)의 계약.
      #
      # 🔴 이 fixture 가 CI 밖에 있으면 로컬 실행에만 의존한다 — 위 넷을 CI 에 둔 것과 같은 이유다.
      #    특히 "자동 거부가 늘지 않았다" 검사가 여기 있다. 품질 플래그는 **선별 보조**이지
      #    거부 엔진이 아닌데, 그 경계는 코드 한 줄이면 무너진다(플래그로 continue 하면 끝이다).
      #    거부로 조용히 버려진 후보는 아무도 세지 않으므로 사람 눈에 띄지 않는다.
      #    막아야 할 회귀가 눈에 안 보이는 종류라 CI 가 대신 봐야 한다.
      #
      # 네트워크 · DB · Sheet 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed 수집 레일 (82cook · 품질 플래그)
        run: npm run micro-seed:collect-check
