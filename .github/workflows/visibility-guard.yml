# Micro Seed 노출 게이트 CI
#
# 정본: docs/constitution/MICRO_SEED_LANE_CONSTITUTION.md §3 C-2 · §4 · §7
#
# 이 워크플로우가 존재하는 이유:
#   M0 에서 3축 판정(src/lib/post-visibility.ts)을 단일 지점으로 세웠지만,
#   가드(scripts/check-post-visibility.mjs)가 로컬 실행뿐이면 사람이 잊는 순간 무력해진다.
#   여러 세션(매거진 트랙 · Micro Seed 트랙)이 병렬로 main 에 들어오는 구조라
#   "각자 로컬에서 돌렸겠지" 를 전제할 수 없다.
#
# main 통합을 따로 보는 이유:
#   PR 두 개가 각각 통과해도 합쳐지면 깨지는 semantic conflict 가 있다.
#   예: A 가 홈 쿼리를 바꾸고 B 가 게이트 함수명을 바꾸면 각 PR 은 녹색이지만 main 은 빨갛다.
#   그래서 merge 된 main 을 **한 번 더** 봐야 한다.
#
#   🔴 옛 판은 `push: branches: [main]` 이었다 — merge 마다 전체가 다시 돌았다.
#      2026-09 실측: 702 회 중 265 회(38%)가 그 재실행이었고 약 700 분을 썼다.
#      같은 트리를 PR 에서 한 번, merge 직후 또 한 번 본 것이다.
#      semantic conflict 는 "merge 직후 1 분 안에" 잡아야 하는 종류가 아니다 —
#      **매일 1 회 nightly** 로 충분하고, 급하면 workflow_dispatch 로 즉시 돌린다.
#
# 🔴 **비용이 이 워크플로우를 멈춘 적이 있다** (2026-09-15).
#    Actions 무료 2,000 분이 소진되어 auto-publish 가 러너를 배정받지 못했다
#    (run 34931463988 · steps=0). CI 비용이 발행을 멈추는 구조였다.
#    그래서 이 파일은 두 가지를 줄인다 — **검사를 빼는 방식이 아니라** 중복과 낭비를 줄인다:
#      ① 실행 횟수 — merge 마다 돌던 전체 재실행을 nightly 1 회로. (절감의 대부분이 여기다)
#      ② 실행 시간 — **진짜 화면 전용 PR** 에서만 무거운 fixture 5 개를 건너뛴다.
#
#    🔴 **경로로 run 을 띄우지 않는 길은 없다.** paths-ignore 를 쓰지 않는다.
#       어떤 PR 이든 워크플로우는 뜨고, 필수 게이트는 전부 돈다.
#       docs · 서버 경로 · 판정 불가는 모두 heavy=true 로 **전체 검사**다 —
#       이 저장소의 문서는 장식이 아니라 검사 대상이기 때문이다(아래 on: 주석 참조).
#       화면 전용으로 내려가는 것은 9 월 실측 기준 241 커밋 중 20 건(8%) 뿐이다.
#
#    이 둘이 사라지면 scripts/workflow-budget-check.mts 가 CI 에서 막는다.
name: visibility-guard

on:
  # 🔴 **경로로 거르지 않는다.** 옛 판은 `paths-ignore: docs/** · **/*.md` 였다.
  #    틀렸다 — 이 저장소의 문서는 장식이 아니라 **검사 대상**이다.
  #
  #    실측(2026-09-15): `docs/operations/CURRENT-MILESTONE.md` 의 `| d3 | **42** |`
  #    한 줄만 고쳐도 `master:doc-check` 가 exit 1 이다. 그 값은 코드
  #    `derive(PROFILES.d3).stockTarget` 과 같아야 하기 때문이다.
  #    paths-ignore 로 걸렀다면 그 회차는 **초록도 빨강도 아닌 무음**이 됐다.
  #
  #    master:doc-check 하나가 docs 14 개를 읽는다. 문서 전용 PR 도 워크플로우는 뜬다.
  pull_request:

  # 🔴 main 통합 검증 — 매일 1 회. UTC 18:00 = KST 03:00 (다음 날).
  #    발행 슬롯(08:10~20:30 KST)과 겹치지 않는 시간을 골랐다 —
  #    러너가 몰리면 auto-publish 가 밀린다.
  schedule:
    - cron: '0 18 * * *'

  # 🔴 급할 때 손으로 돌린다. merge 직후 확인이 필요하면 이 경로를 쓴다.
  workflow_dispatch:

# 같은 PR 에 연속 push 하면 이전 run 을 취소한다 — 러너 시간 낭비를 막는다.
concurrency:
  group: visibility-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Micro Seed 3축 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 변경 경로를 판정하려면 base 커밋이 있어야 한다. depth 1 로는 diff 를 낼 수 없다.
          #    저장소 pack 이 10MB 미만이라 전량 fetch 가 몇 초다.
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────
      # 🔴 **무거운 운영 fixture 를 이 회차에서 돌릴 것인가** — fail-closed
      #
      #    기본값이 heavy=true 다. **아래 좁은 조건을 전부 통과할 때만** false 로 내려간다:
      #      ① pull_request 이벤트이고
      #      ② base 커밋을 실제로 읽을 수 있고
      #      ③ 변경 파일 목록이 비어 있지 않고
      #      ④ 그 전부가 화면 전용 경로다
      #
      #    schedule · workflow_dispatch · base 없음 · diff 실패 · 목록 없음은
      #    **전부 heavy 로 남는다.** 모르면 돌린다 — 모를 때 건너뛰면 그 회차가 구멍이다.
      #
      #    🔴 화면 전용 경로는 **열거한 것만**이다. src/lib · scripts · prisma ·
      #       package-lock · tsconfig · .github 는 전부 heavy 다 —
      #       이들은 영향 범위가 넓어서 어느 fixture 가 깨질지 미리 말할 수 없다.
      # ─────────────────────────────────────────────────────────
      - name: 변경 경로 판정 (fail-closed)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # 🔴 set -e 를 쓰지 않는다. 판정에 실패하면 job 을 죽이는 게 아니라
          #    heavy 로 남겨야 한다 — 그것이 fail-closed 다.
          heavy=true
          reason='기본값 — 모르면 돌린다'

          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_SHA" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null)"
            if [ -z "$files" ]; then
              reason='변경 파일 목록이 비어 있다 — 판정할 수 없다'
            else
              # 🔴 **허용 목록과 금지 목록을 둘 다 본다.** 허용만으로는 부족하다 —
              #    `src/app/` 아래에 API·어드민·server action 이 같이 산다.
              #
              #    ALLOW  화면을 그리는 자리. 여기 없으면 무겁다.
              #    DENY   그 안에 섞여 있는 서버·쓰기 경로. 하나라도 걸리면 무겁다.
              #           실측(2026-09-15): route.ts 5 개가 전부 src/app/api/ 아래이고,
              #           `'use server'` 는 src/lib/actions/ 말고도
              #           src/app/admin/(ops)/**/page.tsx · src/components/admin/ 에 있다.
              #
              #    🔴 docs/ 는 ALLOW 에 넣지 않는다. 무거운 fixture 가 문서를 읽는다 —
              #       d10:prep-check → MASTER-OPERATING-SYSTEM.md · persona-pool-design.md
              #       supply:process-check → launchd/README.md
              #       scale:foundation-check → persona-pool-design.md
              #       문서만 고쳤다고 건너뛰면 **그 문서를 읽는 검사**를 건너뛴다.
              #    🔴 `src/content/magazine/graph/` 는 ALLOW(`src/content/`) 안에 있지만
              #       **화면이 아니다.** 내보내진 그래프 번들이고, 이것이 바뀌면
              #       독자가 보는 연관 글이 통째로 달라진다. DENY 에 넣어 heavy 로 보낸다 —
              #       그러지 않으면 **그래프 전달 PR 이 M-GRAPH 가드를 건너뛴다.**
              #       (2026-09-23 실측: 넣기 전에는 전달 PR 이 「화면 전용」으로 판정됐다)
              ALLOW='^(src/app/|src/components/|src/styles/|src/content/|public/)'
              DENY='(^|/)(api|admin|auth|uploads?)/|(^|/)(route|middleware|actions?)\.ts$|(^|/)actions/|^src/content/magazine/graph/'

              # 🔴 **`grep -qv` 를 쓰지 않는다.** `-q` 와 `-v` 를 함께 준 결과는 구현마다 다르다 —
              #    GNU grep 은 "매치되지 않는 줄이 하나라도 있으면 0", ugrep 은 파일 단위로 뒤집는다.
              #    fail-closed 게이트가 러너에 깔린 grep 종류에 좌우되면 안 된다.
              #    그래서 **세어서 비교한다** — `-c` 의 뜻은 어느 구현에서나 같다.
              total="$(printf '%s\n' "$files" | wc -l | tr -d ' ')"
              allowed="$(printf '%s\n' "$files" | grep -cE "$ALLOW" || true)"
              risky="$(printf '%s\n' "$files" | grep -cE "$DENY" || true)"
              allowed="${allowed:-0}"
              risky="${risky:-0}"
              if [ "$total" -gt 0 ] && [ "$total" = "$allowed" ] && [ "$risky" = '0' ]; then
                heavy=false
                reason="화면 전용 변경만 있다 ($allowed/$total · 서버 경로 0)"
              elif [ "$risky" != '0' ]; then
                reason="서버·쓰기 경로가 ${risky}건 있다 (api · admin · auth · upload · route · action)"
              else
                reason="화면 전용이 아닌 경로가 있다 ($allowed/$total 만 화면)"
              fi
            fi
          elif [ "$EVENT" != "pull_request" ]; then
            reason="$EVENT 회차 — 전체를 본다"
          else
            reason='base 커밋을 읽을 수 없다'
          fi

          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "무거운 fixture 실행: $heavy ($reason)"
          {
            echo "## 변경 경로 판정"
            echo "- 이벤트: \`$EVENT\`"
            echo "- 무거운 fixture 실행: \`$heavy\`"
            echo "- 근거: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          # repo 에 engines·.nvmrc 가 없다. Next 14.2 지원 범위의 LTS 로 고정한다.
          # 버전을 올릴 땐 Vercel 프로젝트 설정과 함께 움직여야 한다.
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 게이트 가드가 먼저다. 순수 파일 파싱이라 Prisma 없이 몇 초면 끝나고,
      # 이게 이 워크플로우의 본래 목적이므로 실패를 가장 빨리 보여준다.
      - name: Micro Seed 노출 게이트
        run: npm run check:visibility

      # 색상 가드도 같은 자리에 둔다 — 순수 파일 파싱이라 Prisma 없이 몇 초다.
      #
      # 🔴 이 스크립트는 있었지만 CI 에 없었다. 로컬에서 기억해 돌리는 사람만 보는 가드는
      #    사람이 잊는 순간 무력해진다 — check:visibility 를 여기 둔 것과 같은 이유다.
      #    이 파일 상단 on: 절에 따라 pull_request 와 main push 양쪽에서 돈다.
      #
      # 검사 범위는 hex 리터럴과 Tailwind arbitrary hex 다.
      # rgb/rgba/hsl · Tailwind 기본 팔레트 · SVG fill/stroke · inline style 직접 색은
      # 아직 보지 않는다. 확장은 후속 PR 로 분리한다 — 이번에는 있는 가드를 켜기만 한다.
      - name: 색상 토큰 가드
        run: npm run check:tokens

      # 브랜드 가드도 같은 자리다 — 색을 지키는 이유와 이름을 지키는 이유가 같다.
      #
      # 🔴 리브랜딩 때 옛 이름이 남는 것은 에러를 내지 않는다. 화면에 그냥 나간다.
      #    그래서 사람이 아니라 CI 가 본다.
      #
      # 검사 대상은 src/**/*.{ts,tsx} 의 브랜드명·문의 이메일 리터럴이다.
      # admin · src/content(발행된 과거 콘텐츠) · 주석은 제외한다.
      # 스크립트가 스스로 self-test 를 먼저 돌려, 가드가 조용히 아무것도
      # 잡지 못하게 되는 경우를 막는다.
      - name: 브랜드 리터럴 가드
        run: npm run check:brand

      # 여기까지가 순수 파일 검사다 — Prisma 없이 몇 초에 끝나므로 generate 앞에 모아 둔다.
      #
      # 🔴 색은 정의가 두 곳(globals.css · brand.ts)이라 한쪽만 움직이면
      #    화면과 OG·manifest 의 색이 조용히 갈린다. 빌드도 타입도 통과한다.
      - name: 색상 정본 관계 검사
        run: npm run check:brand-colors

      # 🔴 리브랜딩에서 가장 위험한 실패는 "겨우 안 보이는 화면"이다.
      #    코랄을 조금 밝히면 화면은 그대로 뜨지만 메타 글씨가 읽히지 않는다.
      #    문서화된 예외는 baseline 으로 안고 가되, 그보다 나빠지면 실패한다.
      #    (후보색 검증용 check:contrast:rebrand 는 예외를 인정하지 않으므로 CI 에 넣지 않는다)
      - name: 대비 검사
        run: npm run check:contrast

      # 🔴 자산 목록이 현실과 어긋나면 목록이 없는 것보다 나쁘다 —
      #    "다 적혀 있다"고 믿고 열었는데 경로가 옛것이면 빠뜨린 줄도 모른다.
      - name: 브랜드 자산 manifest
        run: npm run check:brand-assets

      # 🔴 목록 쪽 이동 경계값 가드. 여기도 순수 파일 검사라 Prisma 앞에 둔다
      #    (src/lib/list-query.ts 는 import 가 하나도 없다 — 몇 초에 끝난다).
      #
      #    이 가드가 막는 것은 **화면으로는 안 보이는 고장**이다:
      #      · page 파싱이 `3.9` 를 3쪽으로 추측해 적힌 것과 다른 화면을 여는 것
      #      · 범위를 넘긴 쪽이 404 대신 빈 200 이 되어 막다른 골목·soft-404 가 되는 것
      #      · 자릿수가 긴 값이 Prisma skip 에 닿아 404 가 아니라 500 이 나는 것
      #    셋 다 빌드도 타입도 통과하고, 사람이 알아채는 때는 이미 배포된 뒤다 —
      #    check:visibility · check:tokens 를 여기 둔 것과 같은 이유로 CI 가 본다.
      - name: 목록 쪽 이동 가드
        run: npm run check:pagination

      # 🔴 /best 순위 식의 성질 가드. 순수 파일 검사라 Prisma 앞에 둔다(약 1초).
      #    막는 것: 계수를 고쳤더니 Persona 댓글이 순위를 올리거나, 조회만으로 기록 자격이 생기거나,
      #    오래된 글이 영영 안 내려가는 것 — 빌드·타입은 모두 통과하는 고장이다.
      #    heavy 뒤에 둔다 — 무조건 step 상한(workflow-budget-check). 식은 src/lib/ 에 있어
      #    식을 고치는 PR 은 화면 전용으로 판정되지 않는다(ALLOW 밖) → 반드시 돈다.
      #    DB 트랜잭션 쪽(best:db-check)은 격리 Postgres 가 필요해 CI 에 넣지 않는다.
      - name: 베스트 순위 식 가드
        if: steps.scope.outputs.heavy == 'true'
        run: npm run check:best

      # typecheck 는 @prisma/client 타입을 필요로 한다.
      # generate 는 스키마만 읽으므로 DB 접속이 없다 — CI 에 DATABASE_URL 을 두지 않는다.
      - name: Prisma Client 생성
        run: npx prisma generate

      # 가드는 정규식 기반이라 "심볼이 사라진 것" 은 잡아도
      # "남은 호출부가 옛 이름을 쓰는 것" 은 못 잡는다.
      # M0 의 getRecentPosts → getRecentDiscoveryPosts 개명이 정확히 그 사례다.
      # 둘을 같이 돌려야 회귀 차단이 실제로 닫힌다.
      - name: 타입 검사
        run: npm run typecheck

      # 🔴 root tsconfig 는 `scripts` 를 **exclude** 한다.
      #    즉 위 `typecheck` 는 이 디렉터리를 한 줄도 보지 않는다 —
      #    micro-seed 도구가 전부 거기 있는데도 그렇다.
      #    2026-09-06 에 그 사각지대에서 타입 오류 4건이 main 까지 갔다
      #    (타입에서 없앤 인자를 계속 넘기는 호출 2곳 · null 좁히기 누락 2곳).
      #    로컬에서 `npm run typecheck:ops` 를 따로 돌리는 사람만 볼 수 있었다.
      - name: 타입 검사 (scripts · ops)
        run: npm run typecheck:ops

      # 🔴 계측은 틀려도 화면이 멀쩡하다. 이벤트가 두 번 나가거나, 실패한 글이 성공으로
      #    세지거나, 보내면 안 되는 값이 하나 섞여도 사용자는 아무것도 못 느낀다.
      #    사람이 알아채는 유일한 순간은 **그 숫자로 판단을 내린 뒤**다 —
      #    check:visibility 를 CI 에 둔 것과 같은 이유로 여기 둔다.
      #
      #    typecheck:ops 바로 뒤다. 이 가드의 magazine·best 차단은 @ts-expect-error 라
      #    타입이 느슨해지면 위 단계가 먼저 잡는다 — 원인이 분명한 순서로 실패한다.
      #    Prisma 가 필요 없지만(레지스트리·analytics 모듈은 DB 를 모른다) 그 이유로
      #    앞으로 당기지 않는다. 짝이 되는 검사 옆에 있는 편이 읽기 쉽다.
      - name: GA4 참여 계측 가드
        run: npm run check:ga4-events

      # 🔴 **여기가 M-GRAPH 의 빌드 차단 지점이다.**
      #
      #    연관 글 그래프는 `src/content/magazine/graph/` 의 정적 TS 를 읽는다.
      #    버전 파일이 빠지거나 해시가 어긋난 채 배포되면 독자 화면이 조용히 틀어진다.
      #    그래서 **런타임 try/catch 로 감싸지 않는다** — 감싸면 깨진 채로 배포된다.
      #    여기서 막으면 새 배포가 승격되지 않고 **기존 운영 배포가 그대로 서빙된다.**
      #    독자에게 보이는 변화가 0 인 실패가 우리가 원하는 실패다.
      #
      #    🔴 이 검사는 안에서 tsc 를 한 번 더 돌린다(버전 파일을 치워 놓고 실패를 확인).
      #       그래서 **무조건 실행이 아니라 heavy 뒤에 둔다** — 진짜 화면 전용 PR 에
      #       추가 tsc 를 지우지 않기 위해서다. 무조건 상한(69)을 올려 통과시키는 것은
      #       비용을 재지 않고 늘리는 일이라 하지 않는다.
      #
      #    🔴 **그래프 전달 PR 은 반드시 heavy 다.** 위 판정의 DENY 에
      #       `^src/content/magazine/graph/` 가 있어서다. 즉 이 가드는
      #       "건너뛸 수 있는 검사" 가 아니라 **"건너뛰어도 되는 회차에만 건너뛰는 검사"** 다.
      #
      #    GA4 가드 옆에 둔다. 클릭 계측(magazine_related_click)이 그 가드의 7종에 들어 있어
      #    둘이 함께 깨지고 함께 고쳐진다.
      - name: M-GRAPH 연관 글 가드
        if: steps.scope.outputs.heavy == 'true'
        run: npm run check:magazine-graph

      # 🔴 M3-A 자동 공급 관문 — **무조건 돈다.**
      #
      #    이 검사는 "등급이 발행을 막지 않는가 · QA 실패가 자동 재생성으로 살아나는가 ·
      #    두 번 실패하면 그 글만 HOLD 되는가" 를 **실제 drive() orchestration** 으로 본다.
      #    heavy 조건에 넣지 않는다 — 여기가 무너지면 공급이 통째로 멈추거나,
      #    반대로 검증 없이 나간다. 둘 다 조용히 지나가면 안 되는 일이다.
      - name: M3-A 자동 공급 관문
        run: npm run check:m3a

      # 🔴 막히는 것은 눈에 띄지만 **왜 막혔는지 말해 주는 것**은 조용히 사라진다.
      #    문구가 다시 뭉개져도 화면은 멀쩡하고 타입도 빌드도 통과한다 —
      #    고객만 자기 글을 처음부터 훑으며 무엇을 고쳐야 하는지 짐작하게 된다.
      #    '지랄' 한 낱말에 그런 일이 실제로 있었고, 그래서 사람이 아니라 CI 가 본다.
      #
      #    GA4 가드 옆에 둔다. 둘 다 "동작은 멀쩡한데 전달이 무너진" 회귀를 잡는 검사라
      #    같은 자리에 모여 있는 편이 다음 사람에게 읽힌다. Prisma 도 DB 도 필요 없다.
      - name: 콘텐츠 가드 피드백
        run: npm run check:content-guard

      # 🔴 히어로 배너는 홈에서 **가장 먼저 보이는 자리**인데, 계약이 무너져도
      #    화면은 멀쩡해 보인다. 종료된 배너가 계속 나가거나, 예약이 한국 시간이 아니라
      #    서버 시간으로 걸리거나, 같은 시각에 6장이 겹쳐도 아무 에러가 나지 않는다.
      #    링크는 더하다 — //evil.com 이 내부 링크로 저장돼도 어드민 화면은 조용하다.
      #
      #    콘텐츠 가드 옆에 둔다. 셋 다 "동작은 멀쩡한데 약속이 깨진" 회귀를 잡는 검사다.
      #    DB · 네트워크 · R2 접근이 없다 — 순수 규칙과 스키마 파일만 읽는다.
      # 🔴 **안전 필터 fixture — 경로 조건 밖에 둔다. 무조건 돈다.**
      #
      #    2026-09-16: 이 검사가 CI 에 **없었다.** 그래서 안전 필터 fixture 는 한 번도
      #    돌지 않았고, 2026-09-13 에 바뀐 계약을 따라가지 못한 fixture 1 건이
      #    **실패한 채로 서 있었다.** 같은 회차에 자해·자살 위기 신호 축이 코드에
      #    한 줄도 없다는 것도 함께 드러났다 — 정본 §4 는 그것을 선행 차단으로
      #    못박아 두었는데도.
      #
      #    🔴 **heavy=false 에서도 생략하지 않는다.** 안전 판정은 화면과 무관하고,
      #       어떤 파일을 고치는 PR 이든 깨뜨릴 수 있다. 실측 0.3 초 · DB·네트워크 0.
      - name: 안전 필터 fixture (위기 신호 · 의료 판단 요청 · 효능 주장)
        run: npm run micro-seed:safety-check
      # 🔴 운영자 직접 작성이 자동 배정·상한·모델 입력을 건드리지 않는다는 계약.
      #    경로 조건 뒤로 보내지 않는다 — 이 계약을 깨뜨리는 것은 자동 레인 파일을
      #    고치는 PR 이고, 그 PR 은 운영 화면 파일을 하나도 건드리지 않는다.
      - name: 운영자 직접 작성 분리 fixture (자동 여력·배정·생성 입력)
        run: npm run operator:compose-check

      # 🔴 **이 워크플로우가 스스로의 비용을 지킨다.**
      #    2026-09-15 무료 한도 소진으로 발행이 멈춘 뒤 세웠다.
      #    무거운 fixture 가 경로 조건 밖으로 나오거나, 무조건 실행 step 이 말없이 늘거나,
      #    PR·nightly 트리거가 사라지면 여기서 빨갛게 뜬다.
      #    순수 파일 파싱이라 Prisma 없이 1 초 미만이다.
      - name: 워크플로우 실행 예산 가드
        run: npm run check:workflow-budget

      - name: 히어로 배너 계약 가드
        run: npm run check:hero-banner

      # ── 매거진 자동 PR 레인 ────────────────────────────────────
      #
      # 🔴 **이 레인은 무인으로 articles.ts 를 고치고 PR 을 연다.**
      #    00:10 producer · 02:00 auto-register 가 launchd 로 매일 돈다.
      #    게이트(HIGH 차단 · autoEligible · 원고 관문 · 미해결 PR 1건 제한 ·
      #    예약 슬롯 · git lifecycle · 종료 코드)가 무너지면 사람이 모르는 채로
      #    잘못된 글이 PR 로 올라간다. 그 회귀를 로컬 실행에만 맡기지 않는다.
      #
      # 🔴 **경로 조건 밖에 둔다 — 무조건 돈다.**
      #    2026-09-16: #524 가 merge 되어 실제 재고가 바뀌자 이 검사가 13건 깨졌는데
      #    CI 에 없어서 아무도 몰랐다. "전 항목 통과" 라고 보고된 뒤였다.
      #    매거진 파일을 건드리지 않는 PR 도 articles.ts 재고를 바꿀 수 있다.
      #
      # DB · 네트워크 · 브라우저 · write 가 전부 없다. 순수 판정이라 1 초 미만이다.
      # (git·gh 는 주입한 가짜 실행기로만 부른다 — 실제 명령을 띄우지 않는다)
      - name: 매거진 자동 레인 게이트
        run: npm run magazine:auto-check

      # ChatGPT 세션 판정 — 살아 있는 CDP 를 chrome_not_running 으로 오분류하면
      # 원고 회수가 통째로 막힌다 (2026-09-16 실측 · 45,418ms 연결).
      # connector·clock 을 주입해 브라우저 없이 돈다.
      - name: ChatGPT 세션 판정 가드
        run: npm run chatgpt:session-check

      # ── Micro Seed Founder Gate fixture ────────────────────────
      #
      # 여기까지의 단계는 "노출 게이트가 살아 있는가" 만 본다.
      # 발행 게이트(R1~R11 · G-A · G-B)가 실제로 막는지는 fixture 가 답한다.
      #
      # 🔴 이걸 CI 에 두지 않으면 회귀 차단이 로컬 실행에만 의존한다.
      #    사람이 잊는 순간 무력해지는 건 check:visibility 와 같은 이유다 —
      #    여러 세션이 병렬로 main 에 들어오는 구조에서 "각자 돌렸겠지" 는 전제할 수 없다.
      #
      # 셋 다 DB · Google Sheet · 네트워크 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      #
      # 순서에 이유가 있다: validate(규칙 자체) → read(Sheet 매핑) → plan(원장 주입 + guard).
      # 아래로 갈수록 위를 딛고 서므로 무너진 층을 가장 먼저 보여준다.
      - name: Micro Seed 검증 규칙 (R1~R11 · G-A · G-B)
        run: npm run micro-seed:validate

      - name: Micro Seed Sheet reader (17열 · 매핑)
        run: npm run micro-seed:read

      # plan 은 tsx 로 돈다 — src/lib/micro-seed-guard.ts 를 직접 부르기 위해서다.
      # .mjs 는 .ts 를 import 할 수 없고, Node 타입 스트리핑은 22.6+ 라 여기(Node 20)선 못 쓴다.
      - name: Micro Seed 발행 계획 (원장 주입 + contentGuard)
        run: npm run micro-seed:plan

      # 위 plan 은 실제 guard 를 주입한 경로다. 주입 배선 자체(fake guard)는 별도로 본다 —
      # guard 없이도 파이프라인이 무너지지 않는지, 미주입이 unchecked 로 드러나는지 확인한다.
      - name: Micro Seed 주입 배선 (guard 미주입 경로)
        run: npm run micro-seed:plan-wiring

      # 수집 레일(82cook collector · 품질 플래그)의 계약.
      #
      # 🔴 이 fixture 가 CI 밖에 있으면 로컬 실행에만 의존한다 — 위 넷을 CI 에 둔 것과 같은 이유다.
      #    특히 "자동 거부가 늘지 않았다" 검사가 여기 있다. 품질 플래그는 **선별 보조**이지
      #    거부 엔진이 아닌데, 그 경계는 코드 한 줄이면 무너진다(플래그로 continue 하면 끝이다).
      #    거부로 조용히 버려진 후보는 아무도 세지 않으므로 사람 눈에 띄지 않는다.
      #    막아야 할 회귀가 눈에 안 보이는 종류라 CI 가 대신 봐야 한다.
      #
      # 네트워크 · DB · Sheet 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed 수집 레일 (82cook · 품질 플래그)
        run: npm run micro-seed:collect-check

      # 승인 레일(approve-live · sync-approval)의 계약.
      #
      # 🔴 approve-live 는 DB 와 Sheet 의 승인 상태를 바꾸는 **운영 명령**이다.
      #    발행 직전 단계를 여는 문이라 여기서 잘못되면 그 다음이 전부 잘못된다.
      #
      #    특히 두 검사가 CI 밖에 있으면 안 된다:
      #      · 단일 candidate 만 승격하는가 — Sheet 전체 승격 경로가 섞여 들어오면
      #        명령은 성공하고 엉뚱한 후보가 발행 대기로 올라간다. 아무도 모른다.
      #      · publisher 를 부르지 않는가 — 승인과 발행 사이에 사람이 서야 한다는
      #        경계가 코드 한 줄로 사라질 수 있다.
      #
      # 네트워크 · DB · Sheet 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed 승인 레일 (approve-live · 단일 후보)
        run: npm run micro-seed:approve-check

      # SRN 승인 화면의 계약.
      #
      # 🔴 이 화면은 사람이 "원문 그대로 내보내겠다" 고 누르는 곳이다.
      #    그래서 막아야 할 회귀가 전부 **조용한** 종류다:
      #      · 다른 축(Seed·Raw·Hold·Drop·Access)이 섞여 들어오는 것 —
      #        화면은 멀쩡히 뜨고, 사람이 누르는 대상만 바뀐다.
      #      · 자격 길이가 title+body 로 슬쩍 바뀌는 것 — §4-Y ④ 는 body 기준이다.
      #        제목은 운영자가 바꿀 수 있어서, 기준에 넣으면 기준이 기준이 아니게 된다.
      #      · 누르지 않은 후보가 기본값으로 승인되어 export 되는 것 —
      #        그러면 "승인" 이 사람의 행위가 아니게 된다.
      #
      # 네트워크 · DB · Sheet 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed SRN 승인 화면 (축 제한 · body 기준 · 사람 승인)
        run: npm run micro-seed:srn-check

      # Seed Originality dry-run 의 계약.
      #
      # 🔴 이 도구는 **남의 글에서 소재만 가져와** 우리 글 초안을 만든다.
      #    막아야 할 회귀가 전부 조용한 종류다:
      #      · 원문 문장이 그대로 옮겨오는 것 — 초안이 아니라 복붙이 된다.
      #        연속 겹침과 낱말 유출을 둘 다 본다.
      #      · 지역명·브랜드명·학년 표현이 남는 것 — 특정 가게·제품 홍보로 읽힌다.
      #      · SEED 아닌 결정(APPROVE·HOLD·DROP)이 입력으로 새는 것.
      #      · 분류하지 못한 행에 그럴듯한 문장을 지어내는 것 —
      #        모르면 초안 0건으로 두고 사람에게 넘겨야 한다.
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed Seed Originality (소재만 · 복붙 0 · 지어내지 않음)
        run: npm run micro-seed:seed-originality-check

      # Seed Originality 초안 검수 화면의 계약.
      #
      # 🔴 여기서 사람이 "이 초안을 쓰겠다" 를 누른다. 막아야 할 회귀:
      #      · 누르지 않은 초안이 기본값으로 export 되는 것 —
      #        그러면 '검수' 가 사람의 행위가 아니게 된다.
      #      · 권장이 실행할 때마다 달라지는 것 — 그러면 그 표시를 믿을 수 없다.
      #        겹침이 가장 작은 것, 동률이면 번호가 작은 것으로 고정한다.
      #      · 복붙 검증 결과(겹침·유출 낱말·금지 호칭)가 화면에서 사라지는 것 —
      #        사람이 "원문 냄새가 난다" 를 스스로 판단할 수 없게 된다.
      #      · 발행 버튼이 생기는 것.
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed Seed Originality 검수 화면 (사람 선택만 · 권장 고정)
        run: npm run micro-seed:seed-originality-review-check

      # Seed Originality 소스 검수 화면의 계약.
      #
      # 🔴 여기서 사람이 "이 소재를 우리 질문으로 바꿀 수 있다" 를 누른다.
      #    막아야 할 회귀:
      #      · APPROVE · ADOPT 버튼이 생기는 것 —
      #        APPROVE 는 SRN 의 "원문 그대로 낸다" 이고(§4-Z ②),
      #        ADOPT 는 초안 검수 단계의 말이다(§4-AB).
      #        같은 낱말을 두 단계에 쓰면 export 를 나중에 볼 때 어느 판정인지 알 수 없다.
      #      · 다른 축(SRN·Raw·Hold·Drop·Access)이 섞여 들어오는 것.
      #      · SEED 아닌 것이 다음 단계로 넘어가는 것 — HOLD·DROP 은 넘어가지 않는다.
      #      · 누르지 않은 후보가 기본값으로 export 되는 것.
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed Seed Originality 소스 검수 (축 제한 · SEED 만 전달)
        run: npm run micro-seed:seed-source-check

      # Raw Originality 레인의 계약 (§4-AF).
      #
      # 🔴 이 레인은 **긴 사연을 우리 말로 다시 쓰기 위한** 것이라
      #    다른 레인과 지켜야 할 것이 다르다. 막아야 할 회귀:
      #      · 본문 전문이 저장되는 것 — 마스킹 후 앞 300자(bodyHead)까지다.
      #        원문이 남으면 사람이 그 문장을 참고하게 되고, 그 순간 "다시 쓰기" 가 아니다.
      #      · 마스킹보다 자르기가 먼저 오는 것 — 경계에 걸친 연락처가 절반만 남아 빠져나간다.
      #      · 산출 경로 가드가 정상 경로까지 막는 것 —
      #        2026-09-06 에 live 로 10건을 읽고도 산출물을 한 줄도 못 쓴 사고가 그것이었다.
      #        그때 fixture 는 소스에 문자열이 있는지만 봤다. 있었고, 그래서 통과했다.
      #      · 후보 선정이 점수순으로 되돌아가는 것 — 댓글 수가 본문 밀도의 대리 신호다(§4-AF ⑫).
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed Raw Originality 레인 (전문 미저장 · 경로 가드 · 댓글순)
        run: npm run micro-seed:raw-check

      # Raw Originality 검수 화면의 계약 (§4-AF ⑥⑬).
      #
      # 🔴 여기서 사람이 "이 사연을 우리 말로 다시 쓸 수 있다" 를 누른다.
      #    막아야 할 회귀:
      #      · APPROVE · ADOPT · SEED 버튼이 생기는 것 —
      #        각각 SRN 승인(§4-Z) · 초안 검수(§4-AB) · 소스 승인(§4-AD) 의 말이다.
      #        같은 낱말이 화면마다 다른 뜻이면 사람이 무엇을 누르는지 모르게 된다.
      #      · rawOriginality 아닌 축이 섞여 들어오는 것.
      #      · export 에 body 전문 컬럼이 생기는 것.
      #      · 누르지 않은 후보가 기본값으로 export 되는 것.
      #      · 화면이 외부 네트워크를 부르는 것 — CSS·JS 인라인 · localStorage 까지다.
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed Raw Originality 검수 화면 (RAW/HOLD/DROP 만 · 전문 미저장)
        run: npm run micro-seed:raw-review-check

      # Raw 재작성 작업대의 계약 (§4-AG ⑨ · T7-1).
      #
      # 🔴 여기는 LLM 이 아니라 사람이 쓰는 자리다. 막아야 할 회귀:
      #      · ADOPT 버튼이 생기는 것 — 여기는 발행 후보 확정이 아니라 작업대다.
      #      · RAW 아닌 판정(HOLD·DROP·미선택)이 작업대에 오르는 것.
      #      · 산출 파일에 원문(bodyHead·body)이 섞여 들어가는 것 —
      #        옮기면 그 파일이 다시 원문 저장소가 된다.
      #      · 겹침 경고가 사라지는 것 — 원문을 보며 쓰다 문장이 따라 나오는 것이
      #        이 레인에서 가장 쉬운 실수다.
      #      · 이미 SAVE 한 원천이 다시 오르는 것(§4-AE 재탕 사고).
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed Raw 재작성 작업대 (SAVE/HOLD/DROP · 원문 미저장 · 겹침 경고)
        run: npm run micro-seed:raw-rewrite-check

      # 발행 후보 파일의 계약 (§4-AH).
      #
      # 🔴 두 레인의 "사람이 고른 글" 이 한 파일로 모이는 자리다. 막아야 할 회귀:
      #      · ADOPT/SAVE 아닌 것이 섞이는 것 — REVISE·HOLD·DROP 은 후보가 아니다.
      #      · SRN(APPROVE)이 들어오는 것 — 원문을 noindex 로 내는 레인이라 정책이 다르다.
      #        섞이면 어느 행이 어떤 정책으로 나가는지 파일만 보고는 알 수 없다.
      #      · 원문(bodyHead·sourceBody)이 새 파일로 새어 나가는 것.
      #      · 중복 키가 sourceArticleId 로 되돌아가는 것 —
      #        한 원천에서 서로 다른 초안 둘이 채택될 수 있어, id 로 묶으면 하나가 사라진다.
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed 발행 후보 파일 (ADOPT/SAVE 만 · SRN 제외 · 원문 미유입)
        run: npm run micro-seed:publish-candidates-check

      # 발행 후보 → 검수 대기열 브리지의 계약 (§4-AJ).
      #
      # 🔴 이 다리는 **이미 살아 있는 발행 경로의 첫 칸**에 글을 얹는다. 막아야 할 회귀:
      #      · status 가 PENDING 이 아닌 값으로 만들어지는 것 —
      #        APPROVED·PUBLISHED 로 바로 가면 사람 검수를 건너뛴다.
      #      · SRN(shortRawNoindex)이 섞이는 것 — noindex 정책이 다른 레인이다.
      #      · ADOPT/SAVE 아닌 판정이나 safety!=pass 가 올라가는 것.
      #      · 두 스위치(--apply + --limit)가 하나로 줄어드는 것 —
      #        적재는 창업자 승인 경로의 첫 칸이라 오타나 크론으로 돌면 안 된다.
      #      · 중복 키가 sourceArticleId 로 되돌아가는 것(§4-AH ⑤ 와 같은 이유).
      #      · 이 스크립트가 발행·승인·배정까지 하게 되는 것.
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      - name: Micro Seed 발행 대기열 브리지 (PENDING 까지 · 두 스위치 · SRN 제외)
        run: npm run micro-seed:publish-enqueue-check

      # 자동 보충은 사람이 매 건을 보지 않는다는 뜻이다. 그래서 사람이 뺀 것을
      # 기계가 도로 집어넣지 않는지 · 발행 코드가 섞여 들어오지 않았는지를 여기서 본다.
      - name: 공급 자동 보충 (APPROVED 까지 · 보류 목록 · 발행 금지)
        run: npm run micro-seed:supply-autofill-check

      # 기계가 사람 판정 층을 넘지 않는지 · 후보 파일 계약이 소비기와 맞는지 본다 (§4-AO)
      - name: 후보 생성 파이프라인 (사람 판정 층 보호)
        run: npm run micro-seed:candidate-pipeline-check

      # 82cook 얇은 상세 — 본문 전문이 디스크에 남지 않는지 본다 (§4-AP)
      - name: 82cook 얇은 상세 fetch (전문 미저장 · 두 스위치)
        run: npm run micro-seed:82cook-thin-check

      # 사본으로도 전문이 새지 않는지 · drop 이 화면에 오르지 않는지 본다 (§4-AQ)
      - name: thin → 검수 어댑터 (전문 미저장 · drop 차단)
        run: npm run micro-seed:82cook-thin-adapt-check

      # 네이버 카페 수집물이 같은 얇은 계약을 타는지 본다 (§4-AV).
      #
      # 🔴 2026-09-07 실측: 네이버 수집물에는 rawBody **전문**이 들어 있었고
      #    (최대 2,899자) 접미가 달라 auto-judge 가 읽지도 못했다.
      #    전문을 들고 있는 레인이 하나라도 있으면 이 레인의 존재 이유가 사라진다.
      #
      # 🔴 네트워크 0 · LLM 0 · DB 0 — 이미 수집된 파일만 다룬다.
      - name: 네이버 카페 얇은 저장 (전문 미저장 · Sheet 금지 · 정치 hard gate)
        run: npm run micro-seed:navercafe-thin-check
      # 원문 게시 시각이 **운영 수집 경로**에서 끝까지 전달되는가.
      #
      # 🔴 앞판은 얇은 변환기에만 배선이 있었고 운영 수집기에는 없었다 —
      #    후보 파일에 칸은 다 있는데 값이 전부 빈 문자열이었다(실측).
      #    그래서 변환기만 보지 않고 수집물 → thin → adapt → 후보까지 행동으로 본다.
      #    가짜 provider · 임시 HOME · 네트워크 0 · DB 0.
      #    🔴 무거운 검사다 — adapt·생성 러너를 자식 프로세스로 돌린다.
      #       그래서 `supply:process-check` 과 같은 조건을 쓴다. `heavy` 는 fail-closed 이고,
      #       화면만 고친 PR(src/app · components · styles · content · public)에서만 꺼진다 —
      #       그런 PR 은 수집 → thin → adapt → 후보 경로를 건드리지 못한다.
      - name: 원문 게시 시각 전달 (수집 → thin → adapt → 후보)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run check:source-times
      # 운영 체인 end-to-end — 🔴 **실제 러너가 쓴 파일**을 실제 적재 순수 함수에 넣는다.
      #    손으로 만든 봉투는 증거가 아니다. 가짜 provider · 임시 HOME · 네트워크 0 · DB 0.
      #    🔴 무거운 검사라 `supply:process-check` 과 같은 조건을 쓴다.
      - name: 운영 체인 end-to-end (러너 → 후보 → 적재 → 큐 → 사람 검토)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run check:supply-chain-e2e
      # Content Core v2 — 🔴 **2026-09-20 부터 운영 생성 경로다.**
      #    옛 `check:quality-ground` 는 v2 통합 검수가 대체해 함께 지웠다.
      #
      # 근거 묶음 → 소재 판정 → 화자·자리 → 말투 근거 → 초안 한 편 → 최소 검수 →
      # 사람 판정 한 장까지 **실제 함수를 돌려** artifact 값으로 본다.
      # 가짜 provider 를 주입한다 — 네트워크 0 · provider 0 · DB 0.
      # 🔴 정규식 존재 검사가 아니다. 통과 수는 제품 성공이 아니다.
      # 🔴 무조건 실행 step 상한(68)을 올리지 않는다 — 경로 조건 뒤에 둔다.
      #    화면만 고친 PR 은 content-core 를 건드릴 수 없다.
      #
      # 🔴 **초안 게이트**(2026-09-26)도 같은 자리다 — 새 step 을 만들지 않는다.
      #    운영 기계 초안 4편(사진 의존 · 1인칭 허가 없는 생활사 · 카드의 지금 삶과 시제)이
      #    `runContentCore → pickV2` 에서 구조화된 사유로 AUTO_HOLD 되는지, 대조 2편은 채택되는지 본다.
      #    가짜 provider · DB 0 · 네트워크 0.
      - name: Content Core v2 세로 경로 (근거·소재·화자 자격·말투·검수 완주)
        if: steps.scope.outputs.heavy == 'true'
        run: |
          npm run check:content-core-v2
          npm run check:draft-life-gates

      # 🔴 **CI 에 없던 검사다.** 그래서 HEAD 에서 이미 깨져 있는 줄 아무도 몰랐다.
      #    세션 정본 경로·권한·모양 계약도 여기서 지킨다 —
      #    상대 경로 하나가 Wave B 다회 수집을 8회 연속 죽였다.
      - name: Naver 수집 계약 (세션 정본 · raw-only)
        run: npm run micro-seed:navercafe-check

      # 🔴 **실제 OS 프로세스 2개로 락 경쟁을 붙인다.**
      #    `unlinkSync(LOCK_PATH)` 는 소스에 멀쩡히 있고 문법도 맞았다 —
      #    누구의 락인지 묻지 않는다는 것은 두 프로세스를 실제로 붙여야 드러난다.
      #    🔴 /tmp 임시 경로만 쓴다. 운영 락은 건드리지 않는다.
      - name: 수집 락 (실제 프로세스 경쟁)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run collect:lock-check

      # 기계 판정이 사람 값을 사칭하지 않는지 · 위험 글이 통과하지 않는지 본다 (§4-AR)
      - name: 자동 판정 Shadow (사람 사칭 금지 · false pass 0)
        run: npm run micro-seed:auto-judge-check

      # 기계 초안이 사람의 ADOPT 를 사칭하지 않는지 · 원천당 1개인지 본다 (§4-AS)
      - name: 기계 초안 채택 (ADOPT 사칭 금지 · 원천당 1개)
        run: npm run micro-seed:auto-draft-check

      # 🔴 독창성 — **흔한 표현은 통과하고 실질 복제만 막는지** 본다 (2026-09-13)
      #
      #    옛 기준은 "공백 빼고 6자 이상 겹치면 복제" 하나였다. 한국어에서 6자는
      #    흔한 표현의 길이라서, 그 기준은 베낀 글이 아니라 **같은 주제의 글**을 걸렀다.
      #    이 검사는 옛 6자 규칙을 fixture 안에서 되살려 대조한다 —
      #    "옛 규칙이라면 막혔고 지금은 통과한다" 를 말이 아니라 실측으로 보인다.
      #    그리고 기준 숫자가 저장소에 한 벌뿐인지 소스에서 직접 확인한다.
      - name: 독창성 정본 (흔한 표현 통과 · 실질 복제 차단 · 기준 한 벌)
        run: npm run draft-originality-check

      # 공급 처리기가 스스로 수집·발행을 하지 않는지 · 한 source 실패가 격리되는지 본다 (§4-AU)
      #
      # 🔴 **이 검사가 지키는 것은 하나다 — 한 source 가 죽어도 나머지 공급은 계속된다.**
      #    옛 중앙 러너는 수집·판정·적재를 한 회차에 묶어서, 82cook 의 `ECONNREFUSED`
      #    하나가 이미 받아 둔 네이버 수집물까지 세웠다(09-10 실측: 이틀간 신규 공급 0).
      #    그래서 가짜 exec 를 주입해 **호출 순서와 횟수**로 격리를 확인한다.
      #
      # 🔴 stale lock 삭제가 게이트 뒤에 있는지는 **실제 파일로** 본다 — 정규식 검사는
      #    "파일 어딘가에 조건문이 있는가" 만 봐서 삭제가 조건 밖에 있어도 통과했다.
      #    임시 디렉터리의 임시 lock 만 쓴다. DATABASE_URL 없이 돌아간다.
      #
      # 🔴 네트워크 0 · LLM 0 · DB 0 — 순수 판정만 검사한다.
      - name: 공급 처리 (수집 금지 · 발행 금지 · source 독립 실패 · lock 게이트)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run supply:process-check

      # 🔴 **backlog 전체를 판정하지 않는다** — 2026-09-20 canary 가 $0.029949 를 쓰고
      #    후보 0건으로 끝난 구조를 막는다. 순수 함수와 소스 계약만 본다
      #    (provider 0 · DB 0 · write 0 · 실측 0.15 초).
      #    🔴 `supply:process-check` 과 **같은 조건**을 쓴다 — 이 계약을 깨뜨릴 수 있는
      #       PR(src/lib · scripts)은 전부 heavy 이고, 화면 전용 PR 은 건드리지 못한다.
      # 🔴 D100 Phase 0 정본 — 재고 이름·Queue/Post 정합·workflow superset·runner 상태·
      #    Persona 확장·North Star·82cook 복구가 한 곳에서 판정된다.
      #    🔴 무거운 검사라 `supply:process-check` 과 같은 조건을 쓴다.
      - name: 🔴 D100 준비도 정본 (재고·정합·runner·Persona·North Star·82cook)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run d100:readiness-check
      - name: 🔴 작업 묶음 — backlog 전체를 판정하지 않는다
        if: steps.scope.outputs.heavy == 'true'
        run: npm run supply:workset-check
      # 🔴 **실제 러너 둘을 돌린다** — 가짜 provider · 임시 HOME · 임시 디렉터리.
      #    소스 문자열이 아니라 나간 요청·장부·산출물 파일에서 값을 읽는다.
      #    🔴 무거운 검사라 `supply:process-check` 과 같은 조건을 쓴다.
      - name: 🔴 작업 묶음 실제 연결 (judge → draft · 장부 id 분리 · 회차 진행성)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run supply:workset-e2e-check
      # 공급 AI 비용 장부 — 🔴 **요청 전 차단**을 행동으로 검사한다.
      #
      # 🔴 이 검사는 가짜 provider 로 `fetch` 를 가로채 **실제로 나간 요청 수**를 센다.
      #    네트워크 0 · 실제 provider 0 · 운영 env 0 · 운영 장부 0 (임시 HOME 을 쓴다).
      #    예산 금액은 시험용 임시 값이며 운영 값이 아니다.
      #
      # 🔴 "일일 과금이 한도를 넘지 않는다" 를 검사하지 않는다 — 그런 보장은 없다.
      #    공식 `count_tokens` 도 추정이고, 이미 보낸 요청의 과금은 취소되지 않는다.
      - name: 공급 AI 비용 장부 (요청 전 차단 · 미정산 예약 · 동시성 · 날짜 경계)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run supply:ledger-check
      # 🔴 정기 공급 회차 몫 보호 (2026-09-29) — 2026-09-28 손 실행 17회가 하루 예산을 먼저 써서
      #    정기 4회차가 초안 0건이었다. 손 실행은 남은 정기 슬롯 몫을 남기고 쓴다.
      #    네트워크 0 · 실제 provider 0 · 운영 env·장부 0 (임시 디렉터리 · 임시 HOME).
      - name: 정기 공급 회차 몫 보호 (launchd 라벨 · 슬롯 창 · KST 자정 · 열린 예약)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run supply:reserve-check
      - name: D100 공급 계획 (게시판 배선 · 요청 상한)
        run: npm run supply:d100-plan-check

      # 관제가 무엇을 장애로 볼지 — 판정만 검사한다 (§4-AW).
      #
      # 🔴 등급을 잘못 매기면 화면이 쓸모없어진다. 매일 CRITICAL 이 뜨면
      #    사람이 곧 무시하고, 그러면 진짜 CRITICAL 도 같이 묻힌다.
      #    그래서 역사 기록·반복 no-op 은 INFO 이고, 소스 하나 실패와
      #    전체 중단은 다른 등급이며, CRITICAL 만 exit 1 이다.
      #
      # 🔴 네트워크 0 · LLM 0 · DB 0 — 순수 판정만 본다.
      - name: 공급 관제 (등급 경계 · 소스 독립 실패 · read-only 계약)
        run: npm run supply:health-check

      # 발행 여력 예측 — 재고가 있어도 persona 가 없으면 나가지 못한다 (§4-AW ③-b).
      #
      # 🔴 2026-09-07 실측: 재고 14/14 로 화면은 초록인데 앞으로 14일 중 절반이 공백이었다.
      #    재고는 "며칠치" 가 아니다 — persona 회전이 막히면 재고가 아무리 많아도 안 나간다.
      #
      # 🔴 KST 경계 · rolling 7일 경계 · 러너 동작 재현(우회 금지)을 고정한다.
      #    네트워크 0 · LLM 0 · DB 0 — 순수 판정만 본다.
      - name: 발행 여력 예측 (KST 경계 · rolling 7일 · 러너 재현)
        run: npm run supply:forecast-check

      # persona 확장 planner — 🔴 **정본 Pool 카드를 읽는 규칙**만 고정한다.
      #
      # 🔴 **실제 조합은 운영 데이터에 따라 변한다** — 큐 재고·발행 이력·활성 persona 가
      #    바뀌면 답도 바뀐다. 특정 코드를 여기 적으면 그날부터 매일 깨진다.
      #    그것을 CI 에 박으면 매일 깨진다. 그래서 여기서는 synthetic 으로 **규칙**만 본다 —
      #    카드 20장을 정확히 읽는가 · 사람을 늘려 발행량이 줄지 않는가 ·
      #    hardFilter 가 카드에서 와도 작동하는가 · planner 가 read-only 인가 ·
      #    정본 §7-1 말투 배분과 카드 voiceCore 가 어긋나지 않는가.
      #    실제 수치는 `npm run persona:capacity-planner` 를 사람이 돌려 본다.
      #    네트워크 0 · LLM 0 · DB 0.
      - name: persona 확장 planner (Pool 카드 파싱 · 단조성 · read-only 계약)
        run: npm run persona:planner-check

      # persona 2차 확장 도구 — 🔴 **순서와 대상 고정**만 본다.
      #
      # 🔴 생성 → seed → 검증 → 활성화. 순서를 어기면 fail-closed 여야 한다 —
      #    seed 없이 켜면 매칭이 그 사람을 기본값으로 잘못 판정한다(#468 재현).
      #    대상(P01·P02·P11)이 코드에 못박혀 있는지, `--code` 인자로 다른 사람을
      #    켤 수 없는지, 실행 게이트가 하나로 열리지 않는지도 함께 고정한다.
      #    DB 0 · 네트워크 0 · 파일 write 0.
      - name: persona 2차 확장 도구 (순서 fail-closed · 대상 고정 · 4중 게이트)
        run: npm run persona:wave2-check

      # 10/day Scale Foundation — 🔴 **회귀 0 이 가장 중요하다.**
      #
      # 🔴 규모 상수(DAILY_PUBLISH_CAP · STOCK_TARGET · POST_CAP_PER_WEEK …)를
      #    `ACTIVE_PROFILE` 하나에서 파생시켰다. 파생값이 옛 하드코딩과 하나라도
      #    다르면 지금 도는 1/day 가 조용히 달라진다 — 그것을 여기서 막는다.
      #    프로필을 몰래 바꾸면 7건이 FAIL 한다(실측 확인).
      #    cohort manifest · 단계 fail-closed · 공급 역산 · 병목도 함께 본다.
      #    DB 0 · 네트워크 0 · LLM 0.
      # 🔴 **하루짜리 첫 시험이 우회가 되지 않는지** 같은 step 에서 본다 (2026-09-21).
      #    날짜가 지나면 저절로 꺼지는가 · 그날치 판정이 NO-GO 면 안 켜지는가 ·
      #    capacity 상한을 시험이라도 비켜 가지 않는가 · `chosenReady` 가 false 로 남는가.
      #
      # 🔴 **새 step 을 만들지 않는다.** 무조건 실행 step 은 69/69 로 상한에 닿아 있다.
      #    이 검사가 읽는 것은 `release-canary.ts` · `scale-runtime.ts` · `scale-profile.ts`
      #    뿐이고 셋 다 `src/lib` 이라 **DENY 에 걸려 언제나 heavy** 다 —
      #    화면 전용 PR 은 이 셋을 건드릴 수 없으므로 경로 조건 뒤가 빠짐없는 자리다.
      #    실측 0.35 초. DB · 네트워크 · write 0.
      #
      # 🔴 **화자 여력 계획**도 같은 자리다 (2026-09-22). 실측 0.24 초.
      #    한 회차가 같은 화자에게 여러 편을 몰아주면 발행 쪽 최소 간격에 걸려
      #    그날 자리가 빈다 — 실측으로 9/23 이 2/3 였다. 읽는 것은 `src/lib` 뿐이라
      #    DENY 에 걸려 언제나 heavy 다.
      #
      # 🔴 **공급 자동화 계약**도 같은 자리다 (2026-09-22). 실측 0.3 초.
      #    여기서 잠그는 것은 "자동화됐다" 는 말이 아니라 **무엇이 안 되는지**다:
      #    공식 edit 뒤에도 machine profile · 원래 화자로 남는가 · 기간형 D3 가
      #    그날 단계를 고정하고 재고 부족에 **실제로 문을 닫는가**(앞판은 로그만 냈다) ·
      #    launchd 가 정말 6회인가 · 정기 회차 전 생산율을 unmeasured 로 적는가.
      #    launchd 템플릿(docs/)을 읽는다 — docs 는 ALLOW 에 없어 언제나 heavy 다.
      - name: Scale Foundation (회귀 0 · cohort · 공급 역산 · 병목)
        if: steps.scope.outputs.heavy == 'true'
        run: |
          npm run scale:foundation-check
          npm run release:canary-check
          npm run speaker:availability-check
          npm run supply:automation-check
          # 🔴 공급 capacity 준비 · 재고 분류 일치 · Persona 여력 대기 (순수 · DB 0)
          npm run supply:stock-parity-check

      # 목적·North Star·Lane·AI 모델·현재 운영 상태의 단일 진입점.
      # 날짜별 문서가 다시 현재 정본을 자처하거나 코드의 기본 모델·d1 workflow와
      # Master가 갈라지면 다음 작업자가 잘못된 전제에서 시작한다.
      # DB 숫자는 가변값이라 CI에 고정하지 않고 Master에 시각이 있는 스냅샷으로만 남긴다.
      - name: Master 운영 문서 (필수 절 · 모델 · workflow · 문서 지도)
        run: npm run master:doc-check

      - name: d10 activation preparation fixture
        if: steps.scope.outputs.heavy == 'true'
        run: npm run d10:prep-check

      # 🔴 자동 단계 사다리 — 순수 계약 (DB 0 · 네트워크 0).
      #    승인 천장을 올리지 않는가 · 시험 기반이 전날 실제 결정에서만 오는가 ·
      #    저장 validator 가 fail-closed 인가 · 발행 러너가 공용 조립을 실제로 쓰는가.
      #    🔴 heavy 조건 뒤에 둔다 — 무조건 step 은 상한(70)에 닿아 있다. 이 검사가 보는
      #       코드(src/lib · scripts · prisma)는 전부 ALLOW 밖이라, 그 코드를 건드리는 PR 은
      #       언제나 heavy 로 판정돼 이 step 이 돈다. 매일 main 예약 실행도 heavy 다.
      - name: 자동 단계 사다리 (승인 천장 · 전날 결정 · 저장 계약)
        if: steps.scope.outputs.heavy == 'true'
        run: |
          npm run stage:ladder-check
          # 🔴 승격 운영 증거(2026-09-29 P0) — 날짜만으로 오르지 않는다 · FAIL/모름 → 같은 단계 재시험 ·
          #    첫 댓글 보장/추가 댓글 상한 분리 · 감사 표본 coverage · 근거 없는 d3→d5 행 거절. 새 step 이 아니다
          npm run stage:evidence-check
          # 🔴 D1→D50 한 사다리(2026-09-29 generic scheduler 배선) — 운영 decideStage 를 여러 날 돌린다 ·
          #    PASS 다음 날 한 칸 · 천장 d10 이면 D20 0 · REPROVE 증명일 · D20+ preflight · 슬롯/비용/롤백. 새 step 이 아니다
          npm run stage:scheduler-check
      # 🔴 무인 운영 루프 — 순수 fixture (DB 0 · launchctl 0). readiness 오판 반례 · 비용 판정 ·
      #    controller 감속/유지/실패 유지 · consumer legacy · keep-awake/복구 템플릿.
      - name: 무인 운영 루프 (readiness 반례 · controller fail-closed · consumer · 템플릿)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run ops:loop-check

      # 🔴 StageDecision 저장 왕복 — **격리 Postgres 17 컨테이너**에서만 돈다. 운영 DB 0.
      #    fixture 로는 잴 수 없는 것(유일키 충돌 · 동시 create · JSON null · NOT NULL 제약)을
      #    실제 DB 로 본다. 주소는 이 step 에만 준다 — 다른 step 에는 DATABASE_URL 이 없다.
      #    🔴 주소·비밀값을 출력하지 않는다. migrate 로그는 파일로만 받고 찍지 않는다
      #       (Prisma 는 접속 host · DB 이름을 출력한다). 검사 자신도 주소를 찍지 않는다.
      #    🔴 주소를 `env:` 에 적지 않는다 — GitHub 은 step env 를 로그 머리에 그대로 찍는다
      #       (af7eb06 실측: 5줄). run 안에서 조각으로 만들고 즉시 mask 한다.
      - name: StageDecision 저장 왕복 (격리 Postgres 17 · 운영 DB 0)
        if: steps.scope.outputs.heavy == 'true'
        env:
          SORAN_ISOLATED_DB: yes-throwaway
        run: |
          pg_user=soran; pg_host=127.0.0.1; pg_port=54329; pg_db=soran_test
          DATABASE_URL="postgresql://${pg_user}@${pg_host}:${pg_port}/${pg_db}"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          export DIRECT_URL="$DATABASE_URL"
          docker run -d --name soran-stage-pg -p "${pg_host}:${pg_port}:5432" \
            -e POSTGRES_USER="$pg_user" -e POSTGRES_DB="$pg_db" \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17 >/dev/null
          ready=0
          for i in $(seq 1 60); do
            if docker exec soran-stage-pg pg_isready -U "$pg_user" -d "$pg_db" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo '🔴 격리 Postgres 가 뜨지 않았다'; exit 1; fi
          if ! npx prisma migrate deploy >/tmp/stage-migrate.log 2>&1; then
            echo '🔴 격리 DB migrate deploy 실패 (로그는 주소를 담고 있어 출력하지 않는다)'
            exit 1
          fi
          echo 'migrate deploy 완료 (격리 DB)'
          npm run stage:db-check
          # 🔴 controller·consumer 실제 진입점 — 같은 격리 DB · 가짜 HOME (운영 env·장부 0)
          npm run ops:loop-db-check
          # 🔴 승격 운영 증거 실제 수집 — 실제 행 6조건 · 행 하나씩 비튼 반례 · 발행 트랜잭션 무인 표식 ·
          #    controller 진입점(dry-run · 가짜 HOME). launchd 가 없는 러너에서는 "러너 모름 → 재시험" 을 본다
          npm run stage:evidence-db-check
          # 🔴 단계 증명일 — 목표 슬롯을 자동 target 이 먼저(사람 복구 행 포함) · 재고 부족이면 혼합 발행 + 증거 FAIL ·
          #    비시험일은 기존 공정성. 실제 로더 · 계획 · 예약 무인 발행 트랜잭션
          npm run stage:proof-day-db-check

      # 🔴 자동 READY v2 — 순수 계약 (DB 0 · 네트워크 0 · LLM 0).
      #    semanticReview fail-closed · 증거 복원 6분류 · 계약 값 불변 · 도장 hash ·
      #    selector 기본 닫힘 · 감사 ceil(N×0.2) · yes 끈적함 · founder 기록 0 · 스위치 기본 OFF.
      #    🔴 증거 배치 검토 화면의 제출 계획(손댄 행만 · 빈 판정 막힘 · 성공 행 잠금 · 기본 확인창 0)도
      #       같은 step 에서 잰다 — 새 step 이 아니다(무조건 step 상한 불변).
      - name: 자동 READY v2 계약 (fail-closed · founder 0 · 스위치 OFF)
        if: steps.scope.outputs.heavy == 'true'
        run: |
          npm run auto-ready:check
          npm run auto-ready:evidence-plan-check
          # 🔴 품질 계약 cohort(2026-09-27) — 게이트·검수 소스가 바뀌었는데 판·확인이 그대로면 실패 ·
          #    legacy 제외 · 판 섞기 불가 · 선행 미검토 닫힘 · 창 안팎 결함 · env/호출자 digest 무시. 새 step 이 아니다
          npm run check:quality-contract
          npm run auto-ready:quality-check
          npm run check:founder-gold
          # 🔴 독립 감사 루프(2026-09-27) — 의미 감사 fail-closed · 묶음(글·도장·원문 근거·카드) · 판 분리 ·
          #    유료 기본 OFF · 감사 러너 launchd 템플릿(렌더만) · 배선. 새 step 이 아니다(무조건 step 상한 불변)
          npm run auto-ready:audit-check

      # 🔴 자동 READY v2 실행 사슬 — 격리 Postgres 17 에서만. 운영 DB 0.
      #    후보 → 도장 → selector → 발행 트랜잭션 재검증 → Post → 감사 저장 → 결함 시 자동 중지,
      #    그리고 동시 도장·동시 발행·동시 감사 선정의 경쟁 조건을 실제 DB 로 부딪혀 본다.
      #    🔴 앞 step 이 띄운 격리 컨테이너를 그대로 쓴다(없으면 새로 띄운다).
      #    🔴 주소를 `env:` 에 적지 않는다 — 조각으로 만들고 즉시 mask 한다.
      - name: 자동 READY v2 실행 사슬 (격리 Postgres 17 · 운영 DB 0)
        if: steps.scope.outputs.heavy == 'true'
        env:
          SORAN_ISOLATED_DB: yes-throwaway
        run: |
          pg_user=soran; pg_host=127.0.0.1; pg_port=54329; pg_db=soran_test
          DATABASE_URL="postgresql://${pg_user}@${pg_host}:${pg_port}/${pg_db}"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          export DIRECT_URL="$DATABASE_URL"
          if ! docker ps --format '{{.Names}}' | grep -qx soran-stage-pg; then
            docker run -d --name soran-stage-pg -p "${pg_host}:${pg_port}:5432" \
              -e POSTGRES_USER="$pg_user" -e POSTGRES_DB="$pg_db" \
              -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17 >/dev/null
            for i in $(seq 1 60); do
              docker exec soran-stage-pg pg_isready -U "$pg_user" -d "$pg_db" >/dev/null 2>&1 && break
              sleep 1
            done
          fi
          if ! npx prisma migrate deploy >/tmp/ar-migrate.log 2>&1; then
            echo '🔴 격리 DB migrate deploy 실패 (로그는 주소를 담고 있어 출력하지 않는다)'
            exit 1
          fi
          npm run auto-ready:db-check
          # 🔴 증거 복원·배치 검토 기록 — 같은 격리 DB 를 스스로 비우고 쓴다
          npm run auto-ready:evidence-db-check
          # 🔴 품질 계약 cohort 실행 반례 — legacy 결함 이력 보존 · 첫 30건 연속 · legacy 도장 0 · 실제 적재기 digest
          #    같은 격리 DB 를 스스로 비우고 쓴다. 새 step 이 아니다(무조건 step 상한 불변)
          npm run auto-ready:quality-db-check
          # 🔴 예약 발행 슬롯 — 트랜잭션 안 슬롯 재계산(같은 격리 DB 를 스스로 비우고 쓴다)
          npm run publish:slot-db-check
          # 🔴 발행 heartbeat 후보 — 10분 wake 하루 · 절전 catch-up · 로컬 천장 · 로컬+GitHub 동시 중복 0 · 러너 틱 잠금
          #    같은 격리 DB 를 스스로 비우고 쓴다. 새 step 이 아니다(무조건 step 상한 불변)
          npm run publish:heartbeat-db-check
          # 🔴 공급 capacity · 발행 release · 재고 분류 일치(공급 9 · 발행 0 반례) — 같은 격리 DB 를 스스로 비우고 쓴다
          npm run supply:stock-parity-db-check
          npm run publish:lane-fairness-db-check
          # 🔴 옛 품질 계약 기계 초안은 지금 계약의 Persona WIP 가 아니다 — 46건 반례 · 큐에 남음 · 자동 발행 0 ·
          #    사람 검토 옛 행 유지 · 행 전체 스냅샷 변경 0 · 실제 buildSpeakerLoad. 같은 격리 DB 를 스스로 비우고 쓴다
          npm run supply:wip-contract-db-check
          # 🔴 부모 → 자식 실제 경로 — 회차 시각 하나(KST 자정·생일 경계) · 여력 0 → provider 0 → personaCapacityDeferred
          #    임시 cwd · 임시 HOME · 합성 말투 자산 · 가짜 키 — 운영 장부·자산 0
          npm run supply:draft-deferral-e2e-db-check
          # 🔴 초안 게이트 → 적재 실제 경로 — 운영 반례 4편은 큐 행이 되지 않고 대조 2편만 APPROVED 로 적재된다
          #    runContentCore → pickV2 → 후보 봉투 → 실제 supply-autofill --apply (임시 cwd · 가짜 provider)
          npm run check:draft-life-gates-db
          # 🔴 독립 감사 루프 실행 반례 — 실제 감사 러너 프로세스(임시 HOME · 가짜 네트워크 · 공급 장부) ·
          #    결함 yes → 다음 도장·발행 닫힘 · 판정 대기 시한 · 동시 러너 결과 1 · 모델 오류는 no 가 아니다.
          #    같은 격리 DB 를 스스로 비우고 쓴다. 새 step 이 아니다(무조건 step 상한 불변)
          npm run auto-ready:audit-db-check
          # 🔴 감사 표본은 그날(KST) 자동 발행에서 — 누적 목표로 오늘 표본 0 이 되던 반례(2026-09-29). 새 step 이 아니다
          npm run auto-ready:audit-day-db-check
          # 🔴 무인 댓글 루프 실행 반례 — 실제 materialize → 9관문 → PENDING → Serializable 발행(autoLane) ·
          #    새 글 1건 · 61분 0 · 자기 글 0 · 글당 1 · 실사용자 3건 0 · 한 건 실패 격리 · 장부 상한 · 동시 회차 1건.
          #    임시 HOME(확정 정본·장부) · 가짜 생성 텍스트 · 네트워크 0. 같은 격리 DB 를 스스로 비우고 쓴다. 새 step 이 아니다
          npm run persona:comment-loop-db-check
          # 🔴 Persona 자동 확장 적재(2026-09-29 · Track C) — valid 만 · draft 만 · 전원 아니면 0 ·
          #    트랜잭션 안 Gate ⑥-B(실회원 이름) · 재적재 거부 · CLI dry-run write 0. 새 step 이 아니다
          npm run persona:autogen-db-check
          # 🔴 작가 해시 v1 → v2 전환(2026-10-01 author-hash v2) — 계획 write 0 · key 없음/섞임/미증명/lock → 거절 ·
          #    중간 실패 전체 롤백 · 재실행 noop(이중 HMAC 0) · 되돌리기 정확 복원 · 두 프로세스 동시 적용 1회 · CLI 기본 계획만.
          #    voice 표를 스스로 비우고 쓴다. 새 step 이 아니다(무조건 step 상한 불변)
          npm run voice:author-hash-db-check

      # 수집 차단기 잠금은 **두 프로세스가 같은 순간에** 같은 파일을 볼 때만 깨진다.
      # 소스 문자열 검사로는 잡을 수 없어 실제 spawn 으로 확인한다.
      # mkdtemp 안에서만 돌고 저장소 .microseed-data 는 건드리지 않는다.
      - name: 수집 차단기 잠금 (실제 프로세스 경쟁)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run collect:guard-lock-check

      # launchd 템플릿이 틀리면 **조용히 아무 일도 안 일어난다** (§4-AU ④-b).
      #
      # 🔴 2026-09-07 실측: job 은 loaded 인데 exit 78 로 죽고 로그가 0바이트였다.
      #    ① launchd 기본 PATH 에 nvm 의 node 가 없어 npx shebang 이 실패
      #    ② 로그를 ~/Documents 아래 두면 TCC 로 파일을 열지 못함
      #    둘 다 프로세스가 뜨기도 전에 죽어 stdout·stderr 어디에도 원인이 없다.
      #    사람이 알아채는 데 며칠이 걸리고, 그동안 공급은 멈추고 큐는 비어간다.
      #
      # 🔴 파일만 읽는다 — launchctl 0 · 네트워크 0 · DB 0.
      #
      # 🔴 발행 heartbeat 후보(2026-09-26)도 같은 자리다 — 새 step 을 만들지 않는다.
      #    정시판 불변(rollback) · 10분 격자 · 틱 잠금 다중 프로세스 경쟁 · 단계 입력 fail-closed ·
      #    예약 수 불변. DB 0 · 네트워크 0 · launchctl 0 (쓰기는 mkdtemp 안에서만).
      - name: launchd 템플릿 (PATH · 로그 위치 · placeholder · 불변 계약)
        run: |
          npm run launchd:template-check
          npm run publish:heartbeat-check

      # 🔴 예약 실행이 개발 브랜치를 돌면 여기서 FAIL 한다.
      #    CI 에는 runtime worktree 가 없으므로 **판정 규칙**만 시험한다 —
      #    실제 관측은 운영 기계에서 `--require-runtime` 으로 요구한다
      - name: 예약 실행 격리 (판정 규칙)
        run: npm run runtime:isolation-check

      # 🔴 Persona 댓글의 속도 제어·대상 선정·입력 계약·공개 release 계약.
      #    🔴 DB·네트워크를 쓰지 않는다 — 순수 함수만 부른다
      #    막아야 할 회귀:
      #      · 실사용자 댓글이 0 인데 Persona 댓글 상한이 열리는 것
      #      · 집계 실패를 0 으로 보정해 상한이 조용히 열리는 것
      #      · env 를 설정하지 않았는데 공개 발행 모드로 도는 것
      #      · 실회원 계정이 붙은 Persona 가 대상으로 뽑히는 것
      #      · 말투 근거 없이 공통 프롬프트로 생성 입력이 만들어지는 것
      #      · 모델 미확정(winner null)인데 provider·Queue 가 열리는 것
      #      · 실회원 글 원문이 외부 모델로 나가는 것
      #      · 사람 승인 없이 APPROVED 로 적재되는 것
      #      · 트랜잭션 재검사 없이 발행하는 것
      #      · runner 미등록인데 "공개 가능" 으로 읽히는 것
      - name: Persona 댓글 엔진 (판정 규칙 + 통합)
        run: npm run persona:comment-engine-check

      # 🔴 **CI 공백이었다** (2026-09-10, Wave E 에서 발견).
      #    프롬프트 계약 fixture 는 이 스크립트에만 있는데 CI 가 돌리지 않았다.
      #    그래서 `20260909-181515` 회차에서 프롬프트가 억지 생활 장면을 시키는 동안
      #    검사는 초록이었다 — 정확히 그 규칙을 **"유지" 로 잠그고 있었는데도** 아무도 못 봤다.
      #    이제 여기서 돌린다. 잠그는 방향은 뒤집혔다:
      #      · 고정 길이 목표(120자·한두 문장)가 **없어야** 통과
      #      · 장면 예시(`설거지하다 말고` …)가 **없어야** 통과
      #      · 첫 글자 회피·어미 미세 통제가 **없어야** 통과
      #      · 말투 근거(reference)가 금지 목록보다 **앞에** 있어야 통과
      - name: Persona 프롬프트 계약 (억지 유도 제거 · 말투 근거 우선)
        run: npm run persona:generate-check

      # 🔴 **선언이 아니라 나갈 문자열을 본다** (2026-09-10, P0-1 사고 이후).
      #    회차 20260910-153254 은 닉네임 약 454건을 프롬프트에 실어 보냈다.
      #    코드에는 "댓글만 읽는다" 고 적혀 있었지만 실제 payload 를 아무도 열어 보지 않았다.
      #    🔴 외부 호출 0 · DB 0 — 프롬프트를 만들기만 하고 부르지 않는다.
      #
      # 🔴 **`|| echo` 를 걷어냈다** (2026-09-11).
      #    옛 줄은 `npm run persona:reference-preflight || echo "🟡 자산 없음 …"` 이었다.
      #    그 `||` 는 **모든 실패**를 성공으로 바꿨다 — 자산이 없을 때뿐 아니라
      #    payload 에 닉네임이 섞였을 때도, digest 가 어긋났을 때도 초록으로 지나갔다.
      #    실제로 이 검사는 옛 합성 코드(S01~S10)를 들고 있어 **언제나 exit 1** 이었고,
      #    `||` 가 그 사실을 가려 아무도 몰랐다.
      #
      #    이제 **자산 부재만** 스크립트가 `🟡 SKIP` 을 찍고 정상 종료한다.
      #    자산이 있는데 검사가 실패하면(누출·digest 불일치·묶음 미성립) **CI 가 빨갛게 뜬다.**
      - name: provider payload preflight (호출 0)
        run: npm run persona:reference-preflight

      # 🔴 **DB 에 연결하지 않는다.** 마이그레이션 판정을 순수 함수로 뽑아 두었으므로
      #    적용됨 / 일부만 / 못 읽음을 가짜 metadata 로 전부 시험한다.
      #    앞선 판은 다른 테이블(0023 MicroSeedCandidate)의 컬럼 이름을 검사하다
      #    없는 컬럼을 조회했고, PostgreSQL 42703 으로 **잡히지 않은 채 죽었다** —
      #    `--check` 를 한 번도 끝까지 돌려 본 적이 없었기 때문이다.
      #    🔴 현재 production DB 는 미적용이고, CI 는 그 DB 를 보지 않는다(write 0 · 연결 0).
      - name: 0024 마이그레이션 계약 (DB 연결 0)
        run: npm run check:migration-0024

      # 🔴 0025 는 **테이블 자체를 만든다.** 0024(컬럼 추가)와 결정적으로 다른 것이 있다 —
      #    테이블이 없는 것이 오류가 아니라 `NOT_APPLIED` 라는 정상 상태이고,
      #    enum 만 생기거나 테이블만 생긴 **반쪽 상태**가 실제로 존재할 수 있다.
      #    그 둘을 "아직 안 했네" 나 "이미 됐네" 로 뭉개면,
      #    `--apply` 가 이미 있는 enum 위에 다시 CREATE 를 걸어 트랜잭션이 통째로 깨진다.
      #    🔴 여기서도 DB 를 보지 않는다 — 가짜 metadata 와 가짜 client 뿐이다(연결 0 · write 0).
      - name: 0025 마이그레이션 계약 (DB 연결 0)
        run: npm run check:migration-0025

      # 🔴 새 계약만 지키면 옛 계약이 조용히 깨진다.
      #    댓글 Gate·생성·발행·대상 규칙과 글 매칭을 **함께** 돌린다 —
      #    생활사 판정을 단일 정본으로 뽑아냈으므로 글 매칭 회귀가 특히 중요하다.
      # 🔴 **비용 통제를 같은 step 에서 본다** (2026-09-21).
      #    댓글 경로는 `callProvider` 를 직접 불러 **장부를 타지 않았다** —
      #    금액 상한을 걸 자리가 없어 "회차 1건" 이라는 건수로만 비용을 말했다.
      #    지금은 글 공급과 같은 장부를 지나고, 이 fixture 가 그 배선을 잠근다:
      #    사용량 미상 · 정산 기록 실패 · 잘린 응답이 후보가 되지 않는지를
      #    실제 세션 → 러너 어댑터 → 적재 파이프라인으로 이어서 확인한다.
      #
      # 🔴 **새 step 을 만들지 않는다.** 무조건 실행 step 은 69/69 로 상한에 닿아 있다
      #    (`scripts/workflow-budget-check.mts` ④). 한 개를 더하면 budget 이 빨개진다.
      #    같은 성격(댓글 후보가 무엇이면 안 되는가)이라 이 step 이 제자리다.
      #    실측 0.62 초(3 회 · 0.81 / 0.62 / 0.62). DB · 네트워크 · provider · write 0.
      - name: Persona 댓글 9관문 Gate
        run: |
          npm run persona:comment-gate-check
          npm run persona:comment-ledger-check
          # 🔴 무인 댓글 루프(2026-09-28 · Track B) — 60분 · 글당 1건 · 자기 글 · 실사용자 3건 · 단계·주체·상태 ·
          #    댓글 전용 장부 하루 $0.20(실제 세션 · 가짜 fetch) · 9관문 정본 그대로. DB · 네트워크 0. 새 step 이 아니다
          npm run persona:comment-loop-check

      - name: Persona 생성 계약
        run: npm run persona:generate-check

      - name: Persona 발행·대상 규칙
        run: |
          npm run persona:publish-rules-check
          npm run persona:target-rules-check
          # 🔴 Persona 자동 확장(2026-09-29 · Track C) — 운영 검증기 그대로 · 반례(축 누락·말투 없음·중복 화자·
          #    실회원·이름만) · 골격 결정론. DB · 네트워크 · LLM 0. 새 step 이 아니다
          npm run persona:autogen-check

      - name: Original Post ↔ Persona 매칭 회귀
        run: npm run original-post:persona-match-check

      # 발행 경로 exact id 타깃팅의 계약 (§4-AK).
      #
      # 🔴 이 타깃팅이 없으면 "이 글만" 이 되지 않는다. 막아야 할 회귀:
      #      · --id 를 줬는데 지정하지 않은 건이 대상에 섞이는 것 —
      #        2026-09-06 에 발행 하나를 위해 내용 모르는 글 둘이 딸려 왔다.
      #      · --limit 이 id 개수와 달라도 통과하는 것 — 잘라내면 무엇이 빠졌는지 모른다.
      #      · id 2건 중 1건만 가능한데 그냥 1건을 처리하는 것.
      #      · --id 가 없을 때 기존 배치 동작이 달라지는 것.
      #      · 필터가 정렬을 바꾸는 것 — dry-run 재현성의 근거다.
      #      · pacing 상수(POST_CAP_PER_WEEK · MIN_DAYS_BETWEEN_POSTS)가 흔들리는 것.
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 함수 판정이라 몇 초면 끝난다.
      - name: Original Post exact id 타깃팅 (지정한 것만 · limit 대조)
        run: npm run original-post:id-target-check

      # 자동 발행 러너의 계약 (§4-AL).
      #
      # 🔴 사람이 매 건을 보지 않고 나가는 경로다. 막아야 할 회귀:
      #      · legacy 글(13~14판 / gemini-*)이 후보에 섞이는 것 —
      #        자동 발행은 "내용을 아는 글" 만 대상이어야 한다.
      #      · gate HOLD · safety fail · 이미 발행된 건이 통과하는 것.
      #      · 후보가 2건 이상인데 그냥 하나를 골라 내보내는 것 —
      #        어느 것을 낼지 정해지지 않았다는 뜻이다.
      #      · 두 스위치(--apply + --limit=1)가 느슨해지는 것.
      #      · 오늘 cap 을 채웠는데 도는 것.
      #      · 발행 뒤 ActivityLog 정합을 안 보는 것 — cap 의 정본이다.
      #      · pacing 상수가 흔들리는 것.
      #
      # 네트워크 · DB · Sheet · LLM 접근이 없다. 순수 함수 판정이라 몇 초면 끝난다.
      - name: Original Post 자동 발행 러너 (publish-candidate-v1 만 · 정확히 1건)
        run: npm run original-post:auto-publish-check

      # 우나어 legacy read-only 커넥터의 계약.
      #
      # 🔴 우나어는 우리 **운영 DB** 다. 커넥터가 write SQL 을 만들 수 있으면
      #    role 권한(SELECT only)과 read-only 트랜잭션이 뚫리는 날 막을 것이 없다.
      #    그리고 원문 컬럼이 하나라도 VoiceSource 에 생기면
      #    "참조하되 복제하지 않는다" 는 1차 전략 전체가 무너진다 —
      #    33,031건 본문과 154,872개 댓글이 소란소란 DB 로 넘어온다.
      #
      #    두 회귀 모두 **조용하다**: 코드는 돌고 테스트는 통과하며
      #    문제는 데이터가 쌓인 뒤에야 드러난다. CI 가 대신 봐야 한다.
      #
      # 네트워크 · DB 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      #
      # 🔴 (2026-10-01 author-hash v2) 작가 해시 정본 helper 하나 — key 없음 → 공개 기본값 금지 · 세대(v1/v2/섞임/손상/다른 key/빈 집합) ·
      #    Gate ⑥-B 는 v2-ready 에서만 · 정적 잠금(helper 밖 공개 사슬 · key env · 인라인 salt 해시 0) · 출력 노출 0.
      #    같은 순수 fixture 라 이 step 에 붙인다(무조건 step 상한 불변).
      - name: Voice 우나어 커넥터 (read-only · 원문 미복제) · 작가 해시 v2 계약
        run: |
          npm run voice:unao-readonly-check
          npm run voice:author-hash-check
          npm run persona:gate6b-check

      # VoiceSource 적재 경로의 계약.
      #
      # 🔴 두 회귀가 조용하다:
      #    · 원문이 소란소란 DB 로 넘어오는 것 — 33,031건 본문과 154,872개 댓글이
      #      한 줄 추가로 따라온다. 코드는 돌고 테스트는 통과한다.
      #    · usedAt 을 approved 로 쓰는 것 — 6,494건이 "사람이 승인했다" 는
      #      거짓 정답지가 되고, Voice Engine 은 그것을 학습한다.
      #
      #    그리고 배치로 번지면 되돌리기 어렵다. 이번 단계는 --limit=1 뿐이다.
      #
      # 네트워크 · DB 접근이 없다. 순수 fixture 판정이라 몇 초면 끝난다.
      # 적재 경로(1건) + 배치 경로(9,674건) 를 함께 본다.
      #
      # 🔴 배치는 1건과 위험의 크기가 다르다. 되돌리기 어렵고,
      #    "--apply 는 --limit 을 요구한다" 가 무너지면 한 번에 9,674건이 들어간다.
      #    중복 SKIP 이 무너지면 재실행이 중복을 쌓는다.
      - name: Voice 적재 경로 (원문 미저장 · 배치 게이트)
        run: npm run voice:unao-import-check

      # 🔴 신규 저장 경로다. 기존 fixture 는 VoiceDerived · VoiceCommentSignal 을 모른다 —
      #    원문 · 댓글 · 닉네임 미저장과 "타겟 설명어 부활" 회귀를 여기서만 잡는다.
      - name: Voice 규칙 신호 (원문 미저장 · 비용 0원 · 타겟 설명어 금지)
        run: npm run voice:derive-check

      # 🔴 VE-M3 부터는 실수가 돈이다. LLM SDK import 한 줄 · fetch 한 줄이 곧 비용이다 —
      #    기존 fixture 는 M3 경로를 모르므로 여기서만 잡힌다.
      # 🔴 VE-M3-3 부터 provider 호출 경로가 생겼다. 허용 파일은 adapter · run 둘뿐이고
      #    유료 게이트 9중 · 저장 전 원문 대조 · API key 로그 유출 0 을 여기서 잡는다.
      - name: Voice M3 (유료 게이트 · 원문 유출 · key 유출 · 층화 표본)
        run: npm run voice:m3-check
