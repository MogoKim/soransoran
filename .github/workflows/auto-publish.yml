# 자동 발행 스케줄러 — 🔴 **발행 로직은 여기 없다**
#
# 정본: docs/operations/2026-09-03-raw-supply-chain-design.md §4-AL
#
# 이 워크플로우가 하는 일은 하나다: **네 단계(d1·d3·d5·d10) 슬롯의 합집합 10회**를 예약해
# `original-post-auto-publish` 를 부른다. 무엇을 낼지 · 낼 수 있는지 · 몇 건까지인지는
# **전부 그 스크립트가 정한다.** 여기서 조건을 다시 판단하거나 우회로를 만들면,
# 판단이 두 곳으로 갈라져 "왜 나갔는지" 를 아무도 설명할 수 없게 된다.
#
# 🔴 **10번 불린다고 10건이 나가지 않는다.**
#    러너는 `github.event.schedule`(이 run 을 띄운 예약 그 자체)이 **지금 stage 의 슬롯인지**
#    보고, 아니면 아무것도 하지 않고 exit 0 한다. d1 이면 09:30 한 번만 일한다.
#    그리고 한 호출당 최대 1건이다 — `--limit` 은 반드시 1 이다.
#      d1 1슬롯 · d3 3슬롯 · d5 5슬롯 · d10 10슬롯 → 각각 하루 1·3·5·10건
#
# 🔴 **중복 발행을 막는 것도 여기가 아니다.**
#    러너가 KST 자정 기준 `PersonaActivityLog` 를 세어 **그 단계의 하루 상한**을 지킨다
#    (`dailyCap` = 단계의 `dailyTarget`. 주입이 없을 때의 안전값이 `DAILY_PUBLISH_CAP`).
#    그러니 이 워크플로우가 두 번 돌아도, 재시도해도, 상한을 넘는 회차는 스스로 멈춘다.
#    여기에 "이미 돌았나" 표식을 따로 두지 않는 이유다 — 그 표식이 정본과 어긋나는 순간이 사고다.
#    🔴 슬롯 판정과 하루 상한은 다른 일을 한다 — 슬롯은 "언제", 상한은 "몇 건" 을 답한다.
#
# 🔴 **지금 운영 단계는 GitHub Variables 가 정한다.** 아래 env 참조.
#    두 Variable 이 **없으면** 러너가 d1 로 떨어진다(fail-closed) — 저장된 d1 이 아니라 부재다.
#
# 🔴 **스케줄만으로는 발행되지 않는다.** DB 접속 secret 이 있어야 한다(아래 env).
#    secret 이 없으면 첫 스텝에서 멈춘다 — 조용히 실패하지 않는다.
name: auto-publish

on:
  schedule:
    # 🔴 GitHub Actions cron 은 **UTC** 다. KST = UTC+9.
    #
    # 🔴 **모든 단계(d1·d3·d5·d10)의 슬롯을 전부 예약한다** (2026-09-12).
    #    옛 판은 `5 15 * * *` 하나뿐이었다. 그래서 `SORAN_RELEASE_STAGE` 를 d10 으로 올려도
    #    워크플로우는 하루 한 번만 러너를 불렀고, 러너는 호출당 1건이므로 **실제로는 1건/day**
    #    였다. 설정과 실제가 어긋났는데 그 어긋남이 로그 어디에도 실패로 남지 않았다.
    #
    #    cron 은 파일에 고정이고 변수로 바꿀 수 없다. 단계마다 yml 을 고쳐야 한다면
    #    "설정만으로 확대" 가 성립하지 않는다. 그래서 합집합을 예약해 두고
    #    **러너가 자기 단계의 슬롯인지 판정**한다 — 단계 변경은 변수 하나로 끝난다.
    #
    # 🔴 **이 목록은 손으로 적지 않는다.** `scale-profile` 의 슬롯이 정본이고
    #    `allStageCronLines()` 가 렌더한다. 어긋나면 scale-foundation-check 가 CI 에서 막는다.
    #    🔴 슬롯을 바꾸면 이 목록도 함께 갱신한다 — 그러면 통과한다.
    #
    # 🔴 **모든 슬롯이 댓글 운영 창(08:00~22:00 KST) 안에 있다** (2026-09-12).
    #    옛 판은 네 단계 전부 `00:05 KST` 를 포함했다. 그러나 §9.5-g 의 확정 계약은
    #    **새 관리형 글의 첫 댓글 60분 안**이고 댓글 runner 는 08:07~22:00 에만 돈다 —
    #    00:05 글은 첫 댓글까지 8시간 넘게 기다렸다. 창 밖 발행은 계약 위반이다.
    #    예약표 대조: 모든 슬롯의 첫 댓글 대기 최대 **43분** · 60분 초과 0건.
    #    🔴 댓글 runner 가 등록·loaded 되고 그 stage 가 가동된다는 **전제**다 —
    #       현재 댓글 runner 는 미등록이라 운영 SLA 달성 실적이 아니다.
    #
    #    ⚠️ GitHub 의 스케줄은 정시에 몰려 **수십 분 지연되거나 건너뛸 수 있다.**
    #       늦게 도는 것은 문제가 아니다 — 러너는 시계가 아니라 `github.event.schedule`
    #       (이 run 을 띄운 예약 그 자체)로 어느 회차인지 판정한다.
    #       건너뛰면 그날 그 회차가 없다 — 상한을 넘기는 쪽이 아니라 모자라는 쪽이라 안전하다.
    #    ⚠️ repo 가 60일간 조용하면 GitHub 이 스케줄을 자동으로 끈다.
    # 08:10 KST · d5 d10
    - cron: '10 23 * * *'
    # 09:30 KST · d1 d3 d10
    - cron: '30 0 * * *'
    # 10:50 KST · d5 d10
    - cron: '50 1 * * *'
    # 12:10 KST · d10
    - cron: '10 3 * * *'
    # 13:30 KST · d3 d5 d10
    - cron: '30 4 * * *'
    # 14:50 KST · d10
    - cron: '50 5 * * *'
    # 16:10 KST · d5 d10
    - cron: '10 7 * * *'
    # 17:30 KST · d10
    - cron: '30 8 * * *'
    # 19:00 KST · d3 d5 d10
    - cron: '0 10 * * *'
    # 20:30 KST · d10
    - cron: '30 11 * * *'

  # 🔴 손으로 돌릴 때는 **dry-run 만** 한다.
  #    secret 을 새로 넣은 뒤 "정말 연결됐나" 를 발행 없이 확인하는 용도다.
  #    실제 발행은 스케줄 경로 하나로만 일어난다 — 발행 버튼을 사람이 누를 일을 만들지 않는다.
  workflow_dispatch:

concurrency:
  # 두 run 이 겹치지 않게 한다. 겹쳐도 러너의 상한이 막지만, 로그가 엉키면 읽기 어렵다.
  group: auto-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 🔴 러너는 `.env.local` 이 없으면 조용히 넘어가고 **기존 process.env 를 덮어쓰지 않는다.**
      #    그래서 여기서 넣은 값이 그대로 쓰인다.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # 🔴 **규모 설정을 명시적으로 전달한다** (2026-09-08).
      #    Settings → Secrets and variables → Actions → Variables 에서 정한다.
      #    비어 있거나 허용 밖 값이면 러너가 **가장 안전한 d1 로 떨어진다**(fail-closed) —
      #    "설정이 이상하니 일단 많이 낸다" 는 경로를 두지 않는다.
      #    🔴 이 값은 하루 상한·주 cap·간격만 정한다. 슬롯(cron)은 아래 schedule 이 정본이며,
      #       둘이 어긋나면 supply-health 가 "워크플로우 불일치" 로 잡는다.
      SORAN_CAPACITY_STAGE: ${{ vars.SORAN_CAPACITY_STAGE }}
      SORAN_RELEASE_STAGE: ${{ vars.SORAN_RELEASE_STAGE }}
    steps:
      - uses: actions/checkout@v4

      # 🔴 secret 이 없으면 여기서 멈춘다.
      #    없는 채로 진행하면 Prisma 가 알 수 없는 말로 죽고, 로그만 보고는 원인을 못 찾는다.
      - name: DB secret 확인
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$DIRECT_URL" ] && missing="$missing DIRECT_URL"
          if [ -n "$missing" ]; then
            echo "🔴 secret 이 없습니다:$missing"
            echo "   Settings → Secrets and variables → Actions 에 등록해야 합니다."
            echo "## 🔴 중단 — DB secret 없음:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ DATABASE_URL · DIRECT_URL 있음 (값은 찍지 않습니다)"

      # 🔴 규모 설정을 **먼저 보여 준다.** 로그만 보고 "왜 1건만 나갔나" 를 알 수 있어야 한다.
      #    값이 없거나 이상해도 여기서 멈추지 않는다 — d1 로 도는 것이 정상 동작이다.
      - name: 규모 설정 확인
        run: |
          cap="${SORAN_CAPACITY_STAGE:-}"
          rel="${SORAN_RELEASE_STAGE:-}"
          valid="d1 d3 d5 d10"
          note=""
          case " $valid " in *" $cap "*) ;; *) note="$note capacity(\"$cap\")→d1"; esac
          case " $valid " in *" $rel "*) ;; *) note="$note release(\"$rel\")→d1"; esac
          if [ -n "$note" ]; then
            echo "🟡 허용 밖/누락 설정 —$note (fail-closed)"
          else
            echo "✅ capacity=$cap · release=$rel"
          fi
          {
            echo "## 규모 설정"
            echo "- capacity: \`${cap:-(없음)}\` · release: \`${rel:-(없음)}\`"
            [ -n "$note" ] && echo "- 🟡 허용 밖/누락 →$note"
            echo "- 🔴 최종 상한은 러너가 준비도까지 반영해 정한다 (로그 ③-c 참조)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          # visibility-guard 와 같은 값을 쓴다. 한쪽만 올리면 재현되지 않는 차이가 생긴다.
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # generate 는 스키마만 읽는다 — 여기서는 DB 에 붙지 않는다.
      - name: Prisma Client 생성
        run: npx prisma generate

      # 🔴 손으로 돌린 경우: **발행하지 않는다.** 연결 확인용이다.
      - name: 자동 발행 (dry-run — 수동 실행)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          npx tsx scripts/original-post-auto-publish.mts 2>&1 | tee /tmp/out.txt
          {
            echo "## 자동 발행 — dry-run (수동 실행)"
            echo '```'
            cat /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔴 실제 발행은 스케줄에서만.
      #    두 스위치(--apply + --limit=1)를 여기서 붙인다 — 러너는 둘 다 없으면 돌지 않는다.
      #    후보 0건 · 상한 소진 · 전체 중지는 러너가 **exit 0** 으로 정상 종료한다(실패가 아니다).
      #    발행 뒤 정합(Queue·Post·ActivityLog)이 어긋나면 **exit 1** 로 여기서 빨갛게 뜬다.
      # 🔴 **어느 회차인지는 시계가 아니라 예약이 말한다.**
      #    `github.event.schedule` 은 이 run 을 띄운 cron 문자열 그대로다.
      #    Actions 가 몇 시간 늦게 시작해도 값은 변하지 않는다 — 그래서 지연에 안전하다.
      #
      # 🔴 **그러나 예약이 아예 오지 않으면 그 값도 없다** (2026-09-14 실측).
      #    `30 0 * * *`(09:30 KST · d1 의 유일한 슬롯)이 배달되지 않았고, 도착한 08:10 회차는
      #    "내 슬롯이 아니다" 로 쉬었다. 재고·배정·cap·kill switch 가 전부 준비된 채 그날 0편.
      #
      #    🔴 **그래서 예약을 더 늘리지 않는다.** 늘려도 같은 큐에서 같이 늦는다.
      #       러너가 `judgeCatchUp` 으로 **도래한 슬롯 − 오늘 발행 수**를 보고 밀린 것을 메운다.
      #       어느 회차가 오든 그날 몫이 채워지고, 두 번 오면 두 번째는 0건이다.
      #       상한은 여전히 러너의 DB 카운트(dailyCap)와 Serializable 트랜잭션이 지킨다.
      #
      # 🔴 `--trigger=schedule` 은 **"늦게 오는 트리거"** 라는 선언이다. 정시 트리거(launchd)는
      #    `--trigger=local` 로 부른다. 둘이 겹쳐도 중복 발행은 0 이다.
      - name: 자동 발행 (apply — 스케줄)
        if: github.event_name == 'schedule'
        env:
          SLOT_CRON: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          npx tsx scripts/original-post-auto-publish.mts --apply --limit=1 --trigger=schedule --slot-cron="$SLOT_CRON" 2>&1 | tee /tmp/out.txt
          {
            echo "## 자동 발행 — $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            echo '```'
            cat /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
