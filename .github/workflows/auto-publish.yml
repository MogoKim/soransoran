# 자동 발행 스케줄러 — 🔴 **발행 로직은 여기 없다**
#
# 정본: docs/operations/2026-09-03-raw-supply-chain-design.md §4-AL
#
# 이 워크플로우가 하는 일은 하나다: 매일 한 번 `original-post-auto-publish` 를 부른다.
# 무엇을 낼지 · 낼 수 있는지 · 몇 건까지인지는 **전부 그 스크립트가 정한다.**
# 여기서 조건을 다시 판단하거나 우회로를 만들면, 판단이 두 곳으로 갈라져
# "왜 나갔는지" 를 아무도 설명할 수 없게 된다.
#
# 🔴 **중복 발행을 막는 것도 여기가 아니다.**
#    러너가 KST 자정 기준 `PersonaActivityLog` 를 세어 하루 1건을 지킨다(DAILY_PUBLISH_CAP).
#    그러니 이 워크플로우가 두 번 돌아도, 재시도해도, 두 번째는 스스로 멈춘다.
#    여기에 "이미 돌았나" 표식을 따로 두지 않는 이유다 — 그 표식이 정본과 어긋나는 순간이 사고다.
#
# 🔴 **스케줄만으로는 발행되지 않는다.** DB 접속 secret 이 있어야 한다(아래 env).
#    secret 이 없으면 첫 스텝에서 멈춘다 — 조용히 실패하지 않는다.
name: auto-publish

on:
  schedule:
    # 🔴 GitHub Actions cron 은 **UTC** 다.
    #    15:05 UTC = **익일 00:05 KST** — KST 자정 직후를 노린다.
    #    자정 직후인 이유: 러너의 하루 상한이 KST 자정에 열리므로,
    #    그 직후에 돌면 하루 안에서 가장 여유 있게 재시도 여지가 남는다.
    #    ⚠️ GitHub 의 스케줄은 정시에 몰려 **수십 분 지연되거나 건너뛸 수 있다.**
    #       늦게 도는 것은 문제가 아니다(그날 안이면 같은 결과).
    #       건너뛰면 그날 발행이 없다 — 상한을 넘기는 쪽이 아니라 모자라는 쪽이라 안전하다.
    #    ⚠️ repo 가 60일간 조용하면 GitHub 이 스케줄을 자동으로 끈다.
    - cron: '5 15 * * *'

  # 🔴 손으로 돌릴 때는 **dry-run 만** 한다.
  #    secret 을 새로 넣은 뒤 "정말 연결됐나" 를 발행 없이 확인하는 용도다.
  #    실제 발행은 스케줄 경로 하나로만 일어난다 — 발행 버튼을 사람이 누를 일을 만들지 않는다.
  workflow_dispatch:

concurrency:
  # 두 run 이 겹치지 않게 한다. 겹쳐도 러너의 상한이 막지만, 로그가 엉키면 읽기 어렵다.
  group: auto-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 🔴 러너는 `.env.local` 이 없으면 조용히 넘어가고 **기존 process.env 를 덮어쓰지 않는다.**
      #    그래서 여기서 넣은 값이 그대로 쓰인다.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      # 🔴 secret 이 없으면 여기서 멈춘다.
      #    없는 채로 진행하면 Prisma 가 알 수 없는 말로 죽고, 로그만 보고는 원인을 못 찾는다.
      - name: DB secret 확인
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$DIRECT_URL" ] && missing="$missing DIRECT_URL"
          if [ -n "$missing" ]; then
            echo "🔴 secret 이 없습니다:$missing"
            echo "   Settings → Secrets and variables → Actions 에 등록해야 합니다."
            echo "## 🔴 중단 — DB secret 없음:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ DATABASE_URL · DIRECT_URL 있음 (값은 찍지 않습니다)"

      - uses: actions/setup-node@v4
        with:
          # visibility-guard 와 같은 값을 쓴다. 한쪽만 올리면 재현되지 않는 차이가 생긴다.
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # generate 는 스키마만 읽는다 — 여기서는 DB 에 붙지 않는다.
      - name: Prisma Client 생성
        run: npx prisma generate

      # 🔴 손으로 돌린 경우: **발행하지 않는다.** 연결 확인용이다.
      - name: 자동 발행 (dry-run — 수동 실행)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          npx tsx scripts/original-post-auto-publish.mts 2>&1 | tee /tmp/out.txt
          {
            echo "## 자동 발행 — dry-run (수동 실행)"
            echo '```'
            cat /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔴 실제 발행은 스케줄에서만.
      #    두 스위치(--apply + --limit=1)를 여기서 붙인다 — 러너는 둘 다 없으면 돌지 않는다.
      #    후보 0건 · 상한 소진 · 전체 중지는 러너가 **exit 0** 으로 정상 종료한다(실패가 아니다).
      #    발행 뒤 정합(Queue·Post·ActivityLog)이 어긋나면 **exit 1** 로 여기서 빨갛게 뜬다.
      - name: 자동 발행 (apply — 스케줄)
        if: github.event_name == 'schedule'
        run: |
          set -o pipefail
          npx tsx scripts/original-post-auto-publish.mts --apply --limit=1 2>&1 | tee /tmp/out.txt
          {
            echo "## 자동 발행 — $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            echo '```'
            cat /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
