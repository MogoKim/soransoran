# 자동 발행 — 🔴 **GitHub 은 더 이상 발행하지 않는다.** 예약(schedule) 없음 · DB write 0
#
# 🔴 **단일 실행 authority** (2026-09-30 · D100 정본 "single always-on runtime owner").
#    발행의 유일한 자동 schedule owner 는 always-on host 의 launchd 발행 러너
#    (`com.soransoran.original-post-runner` → `stage-consume-exec --by=publish` → 러너)다.
#    그 러너만 그날의 StageDecision 을 소비해 같은 트랜잭션 · 상한 · 중복 · 감사 게이트로 쓴다.
#
# 🔴 **지운 옛 authority**
#    · `on.schedule` cron 10줄 — launchd 와 같은 일을 하는 두 번째 schedule owner 였다.
#      2026-09-22~24 에는 실제로 이 경로가 11건을 발행했다(window d3 · canary d5 변수로 천장을 정했다).
#    · `vars.SORAN_CAPACITY_STAGE` · `vars.SORAN_RELEASE_STAGE` · `vars.SORAN_RELEASE_CANARY_*` ·
#      `vars.SORAN_RELEASE_WINDOW_*` 전달 — StageDecision 밖에서 단계를 정하던 두 번째 권위였다.
#    · 러너 직접 실행(`original-post-auto-publish.mts --apply …`) — consumer 를 거치지 않았다.
#
# 🔴 **남은 것은 손으로 누르는 연결 확인(dry-run) 하나다.** 발행 인자(`--apply`)가 없다.
#    이 경로도 consumer(`stage-consume-exec --by=publish`)를 지난다 — 러너를 직접 부르는 길은 어디에도 없다.
#    GitHub 러너에는 host 의 controller 스위치가 없어 consumer 는 가장 안전한 d1 로 본다(연결 확인용이다).
#
# 🔴 이 파일에 schedule · 단계 변수 · 러너 직접 실행을 되살리면
#    `runtime-isolation-check` ⑦(stage-authority-graph)가 CI 에서 막는다.
name: auto-publish

on:
  workflow_dispatch:

concurrency:
  group: auto-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      # 🔴 secret 이 없으면 여기서 멈춘다 — Prisma 가 알 수 없는 말로 죽기 전에.
      - name: DB secret 확인
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$DIRECT_URL" ] && missing="$missing DIRECT_URL"
          if [ -n "$missing" ]; then
            echo "🔴 secret 이 없습니다:$missing"
            echo "## 🔴 중단 — DB secret 없음:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ DATABASE_URL · DIRECT_URL 있음 (값은 찍지 않습니다)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Prisma Client 생성
        run: npx prisma generate

      # 🔴 **dry-run 만.** `--apply` 가 없으면 러너는 쓰지 않는다. consumer 를 거친다.
      - name: 자동 발행 연결 확인 (dry-run — 수동 실행)
        run: |
          set -o pipefail
          npx tsx scripts/stage-consume-exec.mts --by=publish -- npx tsx scripts/original-post-auto-publish.mts 2>&1 | tee /tmp/out.txt
          {
            echo "## 자동 발행 — dry-run (수동 실행 · DB write 0)"
            echo '```'
            cat /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
