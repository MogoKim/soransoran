# 82cook 공급 수집 + 공급 처리 — 🔴 **이 PR 에서 켜지 않는다.** cron 이 없다(수동 실행만)
#
# 정본: docs/operations/MASTER-OPERATING-SYSTEM.md §8.0-D100
#
# 🔴 **왜 필요한가.** 지금 수집과 처리는 전부 이 노트북의 launchd 에 있다.
#    노트북이 꺼져 있으면 그날 공급은 0 이다. 실측으로 09-10 21:10 이후
#    공급 회차가 한 번도 돌지 않았고 신규 승인 가능 글이 이틀간 0 이었다.
#
# 🔴 **그런데 전부 옮길 수는 없다.**
#
#    | source                 | GHA | 왜 |
#    |---|---|---|
#    | 82cook                 | ✅  | 로그인 없는 fetch — 러너에서 그대로 돈다 |
#    | navercafe:remonterrace | 🔴  | 브라우저 + 로그인 세션이 든다 |
#    | navercafe:wgang        | 🔴  | 같음 |
#
#    네이버 세션은 이 기계에만 있고, 세션을 CI secret 으로 옮기는 것은
#    **계정 자격을 러너에 두는 일**이다. 그래서 이 워크플로우는 **82cook 만** 수집한다.
#
# 🔴 **수집과 처리는 서로를 소유하지 않는다.**
#    아래 두 step 은 순서대로 놓여 있을 뿐이고, 처리 step 은 `if: always()` 다 —
#    82cook 수집이 실패해도 **이미 러너에 있는 입력은 그대로 처리된다.**
#    묶어서 한 회차로 돌리던 옛 구조에서는 82cook 하나의 `ECONNREFUSED` 가
#    네이버 공급까지 세웠다. 그 묶음을 푼 것이 이 배치의 전부다.
#
# 🔴 **왜 한 job 의 두 step 인가.** GHA job 은 파일시스템을 공유하지 않는다.
#    수집이 만든 `.microseed-data/*.thin-detail.jsonl` 을 처리가 읽어야 하므로 같은 러너여야 한다.
#    🔴 러너의 파일은 회차가 끝나면 사라진다 — 그래서 이 워크플로우는 **수집만 하고 끝나지 않는다.**
#    남는 것은 DB 의 APPROVED 재고 하나뿐이고, 그것이 노트북과 만나는 유일한 지점이다.
#
# 🔴 **82cook owner 는 언제나 한쪽뿐이다.**
#    로컬 `com.soransoran.supply-collect-82cook-thin` job 과 이 워크플로우 중 하나만 켠다.
#    잠금 파일은 기계마다 따로 있어 서로를 보지 못한다 — 겹치지 않게 하는 방법은
#    **한쪽을 등록하지 않는 것** 하나뿐이다.
#    🔴 반대로 **처리는 겹쳐도 중복 적재가 생기지 않는다** — 적재 단계가
#    `provenanceKey` 로 DB 를 대조하고 트랜잭션 안에서 만든다.
#
# 🔴 **이 워크플로우가 하지 않는 것**: 발행 0 · 네이버 접근 0 · 예약(schedule) 0 · 단계 판단 0.
#
# 🔴 **단일 실행 authority** (2026-09-30 · D100 정본 "single always-on runtime owner").
#    공급 처리의 자동 schedule owner 는 always-on host 의 launchd(`com.soransoran.supply-process`) 하나다.
#    이 워크플로는 **손으로 누르는 비상 경로**뿐이고, 처리 step 은 launchd 와 같은 문
#    (`stage-consume-exec --by=supply`)을 지난다 — 단계는 StageDecision 만 정한다.
#    GitHub 러너에는 host 의 controller 스위치가 없어 consumer 는 가장 안전한 d1 로 본다.
#    🔴 지운 옛 authority: `vars.SORAN_CAPACITY_STAGE` · `vars.SORAN_RELEASE_STAGE` 전달 ·
#       `supply:d100-plan` 계획 step(계획이 실행과 따로 단계를 읽던 두 번째 계산).
name: supply-collect

on:
  # 🔴 schedule 을 두지 않는다 — 자동 owner 는 host launchd 하나다(두 owner 는 `stage-authority-graph` 가 막는다).
  workflow_dispatch:
    inputs:
      apply:
        description: '🔴 true 면 실제 수집·처리. 비우면 secret · 스위치 확인만(네트워크 0 · DB write 0)'
        required: false
        default: 'false'

concurrency:
  # 🔴 이것은 **GHA 안에서의 중복**만 막는다. 노트북과의 중복은 막지 못한다 —
  #    82cook 수집 쪽은 "한쪽만 등록한다" 가, 적재 쪽은 DB dedup 이 막는다.
  group: supply-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # 🔴 judge·draft 가 claude-haiku-4.5 를 부른다. 키가 없으면 그 자리에서 죽는다
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 🔴 **스위치가 둘이고 서로 다른 일을 끈다.** 수집만 끄거나 처리만 끌 수 있어야 한다 —
      #    하나로 묶으면 82cook 을 멈추려다 공급 전체가 멈춘다(옛 구조의 실패다)
      SORAN_82COOK_THIN_DETAIL_ENABLED: ${{ vars.SORAN_82COOK_THIN_DETAIL_ENABLED }}
      SORAN_SUPPLY_PROCESS_ENABLED: ${{ vars.SORAN_SUPPLY_PROCESS_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      # 🔴 **하나씩 확인한다.** 없는 채로 진행하면 Prisma·provider 가 알 수 없는 말로 죽고,
      #    로그만 보고는 "무엇이 없어서" 인지 알 수 없다.
      - name: 실행 전 secret · variable 확인
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL(secret)"
          [ -z "$DIRECT_URL" ] && missing="$missing DIRECT_URL(secret)"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "🔴 없습니다:$missing"
            echo "## 🔴 중단 — 없는 값:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ secret 3종 있음 (값은 찍지 않습니다)"
          # 🔴 스위치는 --apply 회차에서만 필수다. 확인만 하는 회차는 없어도 돈다.
          if [ "${{ inputs.apply }}" = "true" ]; then
            sw=""
            [ "$SORAN_82COOK_THIN_DETAIL_ENABLED" != "true" ] && sw="$sw SORAN_82COOK_THIN_DETAIL_ENABLED(variable)"
            [ "$SORAN_SUPPLY_PROCESS_ENABLED" != "true" ] && sw="$sw SORAN_SUPPLY_PROCESS_ENABLED(variable)"
            if [ -n "$sw" ]; then
              echo "🔴 apply 회차인데 스위치가 true 가 아닙니다:$sw"
              echo "## 🔴 중단 — 스위치:$sw" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "✅ 스위치 2종 true"
          else
            echo "🟡 확인 회차 — 스위치는 확인만 합니다 (82cook=$SORAN_82COOK_THIN_DETAIL_ENABLED · 처리=$SORAN_SUPPLY_PROCESS_ENABLED)"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Prisma Client 생성
        run: npx prisma generate

      # ── ① 82cook 수집 — 🔴 **이 step 은 수집만 한다.** 판정도 적재도 하지 않는다.
      #    상한·요청 간격·robots·403/429 차단기는 이 스크립트 안에 이미 있다.
      - name: 82cook 얇은 상세 수집 (apply)
        id: collect82
        if: github.event_name == 'workflow_dispatch' && inputs.apply == 'true'
        run: |
          set -o pipefail
          # 🔴 한 회차 상한을 여기 손으로 적지 않는다 — 정본에서 역산한다
          CAP="$(npx tsx -e "import {thin82cookCapPerRun} from './src/lib/collect-schedule'; process.stdout.write(String(thin82cookCapPerRun()))")"
          echo "한 회차 상한 ${CAP}건 (collect-schedule 역산)"
          npx tsx scripts/micro-seed-82cook-thin-detail.mts "--cap=${CAP}" --live 2>&1 | tee /tmp/collect.txt
          {
            echo "## 82cook 수집"
            echo '```'
            tail -40 /tmp/collect.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── ② 공급 처리 — 🔴 **수집이 실패해도 돈다** (`always()`).
      #    82cook 이 막힌 것과 이미 있는 입력을 처리하는 것은 다른 일이다.
      #    미처리 입력이 없으면 정상 no-op 으로 끝난다.
      - name: 공급 처리 (수집 실패와 무관하게 실행)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.apply == 'true'
        run: |
          set -o pipefail
          npx tsx scripts/stage-consume-exec.mts --by=supply -- npx tsx scripts/supply-process.mts --live 2>&1 | tee /tmp/process.txt
          {
            echo "## 공급 처리"
            echo "수집 step 결과: ${{ steps.collect82.outcome }}"
            echo '```'
            tail -60 /tmp/process.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
